<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a3a5c">
    <title>Kanawa Soft v11.0 - ERP Completo</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/CpKynFs5/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        /* ===== RESET E VARIÁVEIS ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1a3a5c;
            --primary-dark: #0f2440;
            --primary-light: #2a5a8c;
            --secondary: #217346;
            --secondary-light: #2d9b5e;
            --danger: #dc3545;
            --warning: #f59e0b;
            --info: #3b82f6;
            --success: #10b981;
            --purple: #7c3aed;
            --pink: #ec4899;
            --text: #1e293b;
            --text-muted: #94a3b8;
            --bg: #f1f5f9;
            --bg-card: #ffffff;
            --bg-hover: #f8fafc;
            --border: #e2e8f0;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.12);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.25s ease;
            --header-height: 60px;
            --menu-height: 76px;
        }
        .dark-theme {
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --bg: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #2d3748;
            --border: #334155;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.4);
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            overflow: hidden;
            height: 100vh;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* ===== HEADER ===== */
        .app-header {
            height: var(--header-height);
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
        }
        .app-header .logo-area { display: flex; align-items: center; gap: 10px; }
        .app-header .logo-area img { height: 34px; width: 34px; border-radius: 50%; object-fit: cover; }
        .app-header .logo-area .logo-text { display: flex; flex-direction: column; line-height: 1.2; }
        .app-header .logo-area .logo-text h1 { font-size: 1rem; font-weight: 700; }
        .app-header .logo-area .logo-text h1 span { color: #60a5fa; }
        .app-header .logo-area .logo-text small { font-size: 0.5rem; opacity: 0.7; }
        .app-header .header-actions { display: flex; align-items: center; gap: 8px; }
        .app-header .header-actions .user-info {
            display: flex; align-items: center; gap: 6px; cursor: pointer;
            padding: 3px 10px; border-radius: 20px; background: rgba(255,255,255,0.1);
            transition: var(--transition);
        }
        .app-header .header-actions .user-info:hover { background: rgba(255,255,255,0.2); }
        .app-header .header-actions .user-info img { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); object-fit: cover; }
        .app-header .header-actions .user-info .user-name { font-size: 0.7rem; font-weight: 500; }
        .app-header .header-actions .user-info .user-role { font-size: 0.5rem; opacity: 0.7; background: rgba(255,255,255,0.15); padding: 1px 8px; border-radius: 10px; }
        .app-header .header-actions .btn-icon {
            width: 32px; height: 32px; border: none; border-radius: 50%;
            background: rgba(255,255,255,0.1); color: #fff; cursor: pointer;
            transition: var(--transition); display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; position: relative;
        }
        .app-header .header-actions .btn-icon:hover { background: rgba(255,255,255,0.25); }
        .app-header .header-actions .btn-icon.primary { background: var(--secondary); }
        .app-header .header-actions .btn-icon.primary:hover { background: var(--secondary-light); }
        .api-status {
            display: inline-flex; align-items: center; gap: 4px; font-size: 0.5rem;
            padding: 2px 8px; border-radius: 10px; background: rgba(255,255,255,0.15);
            cursor: pointer;
        }
        .api-status.online { color: #4ade80; }
        .api-status.offline { color: #f87171; }
        .api-status .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
        .api-status.online .dot { background: #4ade80; }
        .api-status.offline .dot { background: #f87171; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ===== MENU TOP ===== */
        .top-menu {
            position: fixed; top: var(--header-height); left: 0; right: 0;
            height: var(--menu-height); background: var(--bg-card);
            border-bottom: 2px solid var(--border); display: flex; align-items: center;
            padding: 0 12px; gap: 2px; overflow-x: auto; overflow-y: hidden;
            z-index: 999; box-shadow: var(--shadow); scrollbar-width: none;
        }
        .top-menu::-webkit-scrollbar { display: none; }
        .top-menu .menu-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-width: 64px; padding: 4px 10px; border: none; border-radius: var(--radius-sm);
            background: transparent; color: var(--text-muted); cursor: pointer;
            transition: all var(--transition); position: relative; gap: 1px; flex-shrink: 0;
        }
        .top-menu .menu-item:hover { background: var(--bg); color: var(--text); transform: translateY(-2px); }
        .top-menu .menu-item.active { color: var(--primary); background: var(--bg); }
        .top-menu .menu-item.active::after {
            content: ''; position: absolute; bottom: 0; left: 15%; right: 15%;
            height: 3px; background: var(--primary); border-radius: 3px 3px 0 0;
        }
        .top-menu .menu-item .menu-icon { font-size: 1.4rem; line-height: 1; }
        .top-menu .menu-item .menu-label { font-size: 0.5rem; font-weight: 600; text-align: center; white-space: nowrap; }

        /* ===== SUBMENU ===== */
        .submenu-overlay {
            display: none; position: fixed; top: calc(var(--header-height) + var(--menu-height));
            left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 998;
            animation: fadeIn 0.2s ease;
        }
        .submenu-overlay.active { display: block; }
        .submenu-panel {
            position: fixed; top: calc(var(--header-height) + var(--menu-height));
            left: 50%; transform: translateX(-50%); background: var(--bg-card);
            border-radius: 0 0 var(--radius) var(--radius); box-shadow: var(--shadow-hover);
            padding: 12px 20px; max-width: 820px; width: 95%; max-height: 55vh;
            overflow-y: auto; z-index: 999; animation: slideDown 0.25s ease;
            border: 1px solid var(--border); border-top: none; display: none;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .submenu-panel .submenu-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 10px; border-bottom: 2px solid var(--border); margin-bottom: 10px;
        }
        .submenu-panel .submenu-header h3 { font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .submenu-panel .submenu-header .close-sub {
            background: none; border: none; font-size: 1.1rem; color: var(--text-muted);
            cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: var(--transition);
        }
        .submenu-panel .submenu-header .close-sub:hover { background: var(--bg); color: var(--text); }
        .submenu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
        .submenu-item {
            display: flex; align-items: center; gap: 8px; padding: 8px 12px;
            border-radius: var(--radius-sm); border: 1px solid var(--border);
            background: var(--bg); cursor: pointer; transition: all var(--transition);
        }
        .submenu-item:hover { border-color: var(--primary); background: var(--bg-hover); transform: translateX(3px); box-shadow: var(--shadow); }
        .submenu-item .sub-icon { font-size: 1rem; width: 24px; text-align: center; color: var(--primary); }
        .submenu-item .sub-label { font-size: 0.7rem; font-weight: 500; color: var(--text); }

        /* ===== MAIN ===== */
        .main-content {
            position: fixed; top: calc(var(--header-height) + var(--menu-height));
            left: 0; right: 0; bottom: 0; overflow: hidden; background: var(--bg);
        }
        .screen-container { width: 100%; height: 100%; overflow-y: auto; padding: 16px; animation: fadeIn 0.3s ease; }

        /* ===== AUTH ===== */
        .auth-container {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: none; align-items: center; justify-content: center;
            background: var(--bg); z-index: 2000;
        }
        .auth-container.active { display: flex; }
        .auth-card {
            background: var(--bg-card); border-radius: var(--radius); padding: 28px;
            max-width: 420px; width: 100%; box-shadow: var(--shadow-hover);
            border: 1px solid var(--border);
        }
        .auth-card .logo { text-align: center; margin-bottom: 20px; }
        .auth-card .logo img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .auth-card .logo h1 { font-size: 1.3rem; font-weight: 800; margin-top: 6px; }
        .auth-card .logo h1 span { color: var(--primary-light); }
        .auth-card .logo p { color: var(--text-muted); font-size: 0.75rem; }
        .auth-card .form-group { margin-bottom: 12px; }
        .auth-card .form-group label { display: block; font-size: 0.7rem; font-weight: 600; margin-bottom: 3px; color: var(--text); }
        .auth-card .form-group input, .auth-card .form-group select {
            width: 100%; padding: 8px 12px; border: 2px solid var(--border);
            border-radius: var(--radius-sm); background: var(--bg); color: var(--text);
            font-size: 0.85rem; transition: var(--transition);
        }
        .auth-card .form-group input:focus, .auth-card .form-group select:focus {
            border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(26,58,92,0.15);
        }
        .auth-card .btn-primary {
            width: 100%; padding: 10px; border: none; border-radius: var(--radius-sm);
            background: var(--primary); color: #fff; font-size: 0.9rem; font-weight: 600;
            cursor: pointer; transition: var(--transition);
        }
        .auth-card .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .auth-card .btn-link { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 0.7rem; text-decoration: underline; padding: 2px 0; }
        .auth-card .auth-footer { text-align: center; margin-top: 14px; font-size: 0.7rem; color: var(--text-muted); }
        .auth-card .auth-footer a { color: var(--primary); cursor: pointer; text-decoration: underline; }
        .error-message { display: none; background: #fee2e2; color: #dc2626; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 0.75rem; margin-bottom: 10px; }
        .error-message.show { display: block; }
        .success-message { display: none; background: #d1fae5; color: #065f46; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 0.75rem; margin-bottom: 10px; }
        .success-message.show { display: block; }
        .code-input-group { display: flex; gap: 8px; justify-content: center; }
        .code-input-group input {
            width: 44px; height: 50px; text-align: center; font-size: 1.2rem; font-weight: 700;
            border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text);
        }
        .code-input-group input:focus { border-color: var(--primary); outline: none; }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed; bottom: 16px; right: 16px; z-index: 9999;
            display: flex; flex-direction: column; gap: 6px; max-width: 340px;
        }
        .toast {
            background: var(--bg-card); color: var(--text); padding: 10px 14px;
            border-radius: var(--radius-sm); box-shadow: var(--shadow-hover);
            border-left: 4px solid var(--primary); display: flex; align-items: center;
            gap: 8px; animation: slideInRight 0.3s ease; font-size: 0.8rem;
        }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        .toast.warning { border-left-color: var(--warning); }
        .toast.info { border-left-color: var(--info); }
        .toast .toast-close { margin-left: auto; background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.9rem; padding: 0 4px; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }

        /* ===== COMPONENTES ===== */
        .card { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); padding: 14px 18px; margin-bottom: 12px; box-shadow: var(--shadow); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 6px; }
        .card-header .card-title { font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
        .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
        .metric-card {
            background: var(--bg-card); border-radius: var(--radius-sm); padding: 14px;
            border: 1px solid var(--border); border-left: 4px solid var(--primary); box-shadow: var(--shadow);
        }
        .metric-card .metric-label { font-size: 0.65rem; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        .metric-card .metric-value { font-size: 1.3rem; font-weight: 700; margin-top: 2px; }
        .metric-card .metric-icon { float: right; font-size: 1.4rem; opacity: 0.2; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        table thead { background: var(--bg); }
        table th { padding: 8px 10px; text-align: left; font-weight: 600; color: var(--text-muted); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid var(--border); }
        table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
        table tbody tr:hover { background: var(--bg); }
        .btn {
            padding: 5px 12px; border: none; border-radius: var(--radius-sm);
            font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: var(--transition);
            display: inline-flex; align-items: center; gap: 4px;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-warning { background: var(--warning); color: #fff; }
        .btn-warning:hover { background: #d97706; }
        .btn-info { background: var(--info); color: #fff; }
        .btn-info:hover { background: #2563eb; }
        .btn-purple { background: var(--purple); color: #fff; }
        .btn-purple:hover { background: #6d28d9; }
        .btn-pink { background: var(--pink); color: #fff; }
        .btn-pink:hover { background: #db2777; }
        .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); }
        .btn-sm { padding: 3px 8px; font-size: 0.6rem; }
        .badge {
            display: inline-block; padding: 2px 8px; border-radius: 10px;
            font-size: 0.55rem; font-weight: 600;
        }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-info { background: #dbeafe; color: #1e40af; }
        .badge-primary { background: #dbeafe; color: #1a3a5c; }
        .badge-purple { background: #ede9fe; color: #5b21b6; }
        .badge-pink { background: #fce7f3; color: #9d174d; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .form-grid .form-group { display: flex; flex-direction: column; }
        .form-grid .form-group label { font-size: 0.65rem; font-weight: 600; margin-bottom: 3px; }
        .form-grid .form-group input, .form-grid .form-group select, .form-grid .form-group textarea {
            padding: 6px 10px; border: 2px solid var(--border); border-radius: var(--radius-sm);
            background: var(--bg); color: var(--text); font-size: 0.8rem; transition: var(--transition);
        }
        .form-grid .form-group input:focus, .form-grid .form-group select:focus, .form-grid .form-group textarea:focus {
            border-color: var(--primary); outline: none;
        }
        .form-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 3000; align-items: center; justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-card); border-radius: var(--radius); padding: 20px 24px;
            max-width: 560px; width: 95%; max-height: 85vh; overflow-y: auto;
            box-shadow: var(--shadow-hover); border: 1px solid var(--border);
            animation: slideDown 0.25s ease;
        }
        .modal .modal-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 2px solid var(--border); margin-bottom: 12px; }
        .modal .modal-header h3 { font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .modal .modal-header .modal-close { background: none; border: none; font-size: 1.1rem; color: var(--text-muted); cursor: pointer; padding: 2px 6px; border-radius: 4px; }
        .modal .modal-header .modal-close:hover { background: var(--bg); }
        .modal .modal-actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
        .modal-large { max-width: 780px; }

        /* ===== ESPECÍFICOS ===== */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
        .product-card {
            background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border);
            padding: 12px; text-align: center; transition: var(--transition);
        }
        .product-card:hover { border-color: var(--primary); box-shadow: var(--shadow-hover); transform: translateY(-4px); }
        .product-card .product-image { width: 100%; height: 140px; object-fit: cover; border-radius: var(--radius-sm); background: var(--bg); }
        .product-card .product-name { font-weight: 600; font-size: 0.8rem; margin-top: 8px; }
        .product-card .product-price { color: var(--secondary); font-weight: 700; font-size: 0.9rem; }
        .product-card .product-rating { color: var(--warning); font-size: 0.7rem; }
        .kanban-columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .kanban-column { background: var(--bg); border-radius: var(--radius-sm); padding: 10px; border: 1px solid var(--border); }
        .kanban-column h5 { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
        .kanban-card { background: var(--bg-card); border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; border: 1px solid var(--border); cursor: pointer; transition: var(--transition); }
        .kanban-card:hover { border-color: var(--primary); box-shadow: var(--shadow); }
        .chart-container { position: relative; height: 250px; width: 100%; }
        .audiobook-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 12px; transition: var(--transition); display: flex; gap: 12px;
        }
        .audiobook-card:hover { border-color: var(--primary); box-shadow: var(--shadow-hover); transform: translateY(-2px); }
        .audiobook-card .audiobook-thumb { width: 80px; height: 100px; object-fit: cover; border-radius: var(--radius-sm); }
        .audiobook-card .audiobook-info { flex: 1; }
        .audiobook-card .audiobook-info .title { font-weight: 600; font-size: 0.9rem; }
        .audiobook-card .audiobook-info .author { font-size: 0.75rem; color: var(--text-muted); }
        .audiobook-card .audiobook-info .rating { font-size: 0.7rem; color: var(--warning); }
        .audiobook-card .audiobook-info .price { font-size: 0.8rem; color: var(--secondary); font-weight: 700; }
        .ddg-result, .bing-result {
            background: var(--bg); border-radius: var(--radius-sm); padding: 12px;
            border: 1px solid var(--border); margin-bottom: 8px; transition: var(--transition);
        }
        .ddg-result:hover, .bing-result:hover { border-color: var(--primary); background: var(--bg-hover); }
        .chat-container {
            display: grid; grid-template-columns: 260px 1fr; gap: 12px; height: calc(100% - 20px);
        }
        .chat-sidebar {
            background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border);

function formatCurrency(value) {
    return new Intl.NumberFormat('pt-AO', {
        style: 'currency',
        currency: 'AOA',
        minimumFractionDigits: 2
    }).format(value || 0);
}

function formatDate(date) {
    if (!date) return '-';
    return new Date(date).toLocaleDateString('pt-AO');
}

function formatDateTime(date) {
    if (!date) return '-';
    return new Date(date).toLocaleString('pt-AO');
}

function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
    toast.innerHTML = `
        <span>${icons[type] || 'ℹ️'}</span>
        <span>${message}</span>
        <button class="toast-close" onclick="this.parentElement.remove()">✕</button>
    `;
    container.appendChild(toast);
    setTimeout(() => {
        if (toast.parentElement) {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 300);
        }
    }, 3500);
}

function openModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) { modal.classList.add('active'); modal.style.display = 'flex'; }
}

function closeModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) { modal.classList.remove('active'); modal.style.display = 'none'; }
}

function moveToNext(input, nextId) {
    if (input.value.length >= 1 && nextId) {
        const nextInput = document.getElementById(nextId);
        if (nextInput) nextInput.focus();
    }
    if (input.value.length === 0) {
        const prev = input.previousElementSibling;
        if (prev && prev.tagName === 'INPUT') prev.focus();
    }
}

function gerarCodigo2FA() {
    const code = Math.floor(100000 + Math.random() * 900000).toString();
    twoFactorCode = code;
    localStorage.setItem('kanawa_2fa_codigo', code);
    localStorage.setItem('kanawa_2fa_data', new Date().toISOString());
    return code;
}

function enviarCodigoPorEmail(email, codigo) {
    console.log(`📧 Email enviado para ${email}: ${codigo}`);
    adicionarNotificacao('📧 Email 2FA', `Código: ${codigo} para ${email}`, 'success');
    showToast(`📧 Email enviado para ${email}`, 'info');
    return true;
}

function enviarCodigoPorSMS(numero, codigo) {
    console.log(`📱 SMS enviado para ${numero}: ${codigo}`);
    adicionarNotificacao('📱 SMS 2FA', `Código: ${codigo} para ${numero}`, 'success');
    showToast(`📱 SMS enviado para ${numero}`, 'info');
    const smsEnviados = JSON.parse(localStorage.getItem('kanawa_sms_2fa') || '[]');
    smsEnviados.push({ numero, codigo, data: new Date().toISOString(), status: 'entregue' });
    localStorage.setItem('kanawa_sms_2fa', JSON.stringify(smsEnviados));
    return true;
}

function enviarCodigoPorWhatsApp(numero, codigo) {
    console.log(`💬 WhatsApp enviado para ${numero}: ${codigo}`);
    adicionarNotificacao('💬 WhatsApp 2FA', `Código: ${codigo} para ${numero}`, 'success');
    showToast(`💬 WhatsApp enviado para ${numero}`, 'info');
    return true;
}

function enviarCodigo2FA(destino) {
    const codigo = gerarCodigo2FA();
    twoFactorCode = codigo;
    localStorage.setItem('kanawa_2fa_codigo', codigo);
    localStorage.setItem('kanawa_2fa_data', new Date().toISOString());
    const metodos = JSON.parse(localStorage.getItem('kanawa_2fa_metodos') || '["email"]');
    metodos.forEach(metodo => {
        switch(metodo) {
            case 'email': enviarCodigoPorEmail(destino.email || 'admin@kanawasoft.com', codigo); break;
            case 'sms': enviarCodigoPorSMS(destino.telefone || numeroTelefone, codigo); break;
            case 'whatsapp': enviarCodigoPorWhatsApp(destino.telefone || numeroTelefone, codigo); break;
        }
    });
    showToast(`📨 Código enviado por: ${metodos.join(', ')}`, 'success');
    return codigo;
}

function verificarCodigo2FA(inputCode) {
    if (inputCode === twoFactorCode) return true;
    const savedCode = localStorage.getItem('kanawa_2fa_codigo');
    if (savedCode && inputCode === savedCode) return true;
    return false;
}

function reenviarCodigo2FA() {
    if (pending2FAUser) {
        const destino = { email: pending2FAUser.email || 'admin@kanawasoft.com', telefone: numeroTelefone };
        enviarCodigo2FA(destino);
        showToast(`📨 Código reenviado!`, 'success');
        for (let i = 1; i <= 6; i++) {
            const input = document.getElementById(`code${i}`);
            if (input) input.value = '';
        }
        document.getElementById('code1')?.focus();
    } else {
        showToast('⚠️ Nenhum usuário pendente', 'warning');
    }
}

function handleLogin(event) {
    event.preventDefault();
    if (contaBloqueada) {
        showToast('🔒 Conta bloqueada. Aguarde 15 minutos.', 'error');
        return;
    }

    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const errorDiv = document.getElementById('authError');
    const successDiv = document.getElementById('authSuccess');
    if (errorDiv) errorDiv.classList.remove('show');
    if (successDiv) successDiv.classList.remove('show');

    if (document.getElementById('twoFactorGroup').style.display !== 'none') {
        const code = Array.from({length: 6}, (_, i) => document.getElementById(`code${i+1}`)?.value || '').join('');
        if (verificarCodigo2FA(code)) {
            finalizarLogin(pending2FAUser);
        } else {
            if (errorDiv) {
                errorDiv.textContent = '❌ Código 2FA inválido. Tente novamente.';
                errorDiv.classList.add('show');
            }
            tentativasFalhas++;
            verificarBloqueio();
        }
        return;
    }

    if (email === 'admin@kanawasoft.com' && password === 'admin123') {
        pending2FAUser = { name: 'Administrador', email: email, role: 'admin', telefone: numeroTelefone };
        enviarCodigo2FA({ email: email, telefone: numeroTelefone });
        document.getElementById('twoFactorGroup').style.display = 'block';
        document.getElementById('loginBtn').textContent = 'Verificar';
        document.getElementById('code1')?.focus();
        if (successDiv) {
            successDiv.textContent = `📨 Código enviado! Verifique: ${metodos2FA.join(', ')}`;
            successDiv.classList.add('show');
        }
        tentativasFalhas = 0;
    } else {
        if (errorDiv) {
            errorDiv.textContent = '❌ Email ou senha incorretos. Use admin@kanawasoft.com / admin123';
            errorDiv.classList.add('show');
        }
        tentativasFalhas++;
        verificarBloqueio();
    }
}

function finalizarLogin(user) {
    const successDiv = document.getElementById('authSuccess');
    if (successDiv) {
        successDiv.textContent = '✅ Login realizado com sucesso!';
        successDiv.classList.add('show');
    }
    const userData = { name: user.name || 'Administrador', email: user.email, role: user.role || 'admin' };
    localStorage.setItem('kanawa_user', JSON.stringify(userData));
    API_MODE = 'local';
    localStorage.setItem('kanawa_api_mode', 'local');
    DB.init();
    
    DB.sessoes.push({
        id: DB.sessoes.length + 1,
        usuarioId: 1,
        usuario: userData.name,
        data: new Date().toISOString(),
        token: generateId(),
        ativo: true
    });
    DB.save();
    tentativasFalhas = 0;
    contaBloqueada = false;
    
    setTimeout(() => {
        document.getElementById('authContainer').style.display = 'none';
        document.getElementById('appContainer').style.display = 'block';
        document.getElementById('headerUserName').textContent = userData.name;
        document.getElementById('headerUserRole').textContent = userData.role;
        document.getElementById('headerAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(userData.name)}&background=1a3a5c&color=fff`;
        initApp();
        showToast('✅ Bem-vindo ao Kanawa Soft v11.0!', 'success');
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }
    }, 500);
}

function handleRegister(event) {
    event.preventDefault();
    const errorDiv = document.getElementById('registerError');
    const successDiv = document.getElementById('registerSuccess');
    if (errorDiv) errorDiv.classList.remove('show');
    if (successDiv) successDiv.classList.remove('show');

    const password = document.getElementById('registerPassword').value;
    const confirm = document.getElementById('registerPasswordConfirm').value;
    if (password !== confirm) {
        if (errorDiv) { errorDiv.textContent = '❌ As senhas não coincidem'; errorDiv.classList.add('show'); }
        return;
    }
    const email = document.getElementById('registerEmail').value;
    const telefone = document.getElementById('registerTelefone').value;
    if (telefone) { numeroTelefone = telefone; localStorage.setItem('kanawa_telefone_2fa', telefone); }
    if (successDiv) {
        successDiv.textContent = '✅ Conta criada localmente!';
        successDiv.classList.add('show');
    }
    setTimeout(() => {
        showLogin();
        document.getElementById('loginEmail').value = email;
        showToast('✅ Conta criada! Faça login.', 'success');
    }, 1500);
}

function handleForgotPassword(event) {
    event.preventDefault();
    const successDiv = document.getElementById('forgotSuccess');
    if (successDiv) {
        successDiv.textContent = '✅ Link enviado para seu email!';
        successDiv.classList.add('show');
    }
    setTimeout(() => { showLogin(); showToast('✅ Link enviado!', 'success'); }, 2000);
}

function verificarBloqueio() {
    if (tentativasFalhas >= 5) {
        contaBloqueada = true;
        document.getElementById('authError').textContent = '🔒 Conta bloqueada por múltiplas tentativas. Aguarde 15 minutos.';
        document.getElementById('authError').classList.add('show');
        showToast('🔒 Conta bloqueada por 15 minutos', 'error');
        setTimeout(() => {
            contaBloqueada = false;
            tentativasFalhas = 0;
            document.getElementById('authError').classList.remove('show');
            showToast('🔓 Conta desbloqueada', 'success');
        }, 900000);
    }
}

function logout() {
    if (confirm('Tem certeza que deseja sair?')) {
        localStorage.removeItem('kanawa_user');
        localStorage.removeItem('kanawa_api_token');
        API_TOKEN = null;
        document.getElementById('appContainer').style.display = 'none';
        showLogin();
        showToast('👋 Logout realizado!', 'info');
    }
}

function toggleTheme() {
    document.body.classList.toggle('dark-theme');
    const icon = document.getElementById('themeIcon');
    const isDark = document.body.classList.contains('dark-theme');
    if (icon) icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
}

async function checkAPIStatus() {
    try {
        const response = await fetch(`${API_URL}/health`);
        if (response.ok) {
            const status = document.getElementById('apiStatus');
            if (status) {
                status.className = 'api-status online';
                document.getElementById('apiStatusText').textContent = 'API Online';
            }
            return true;
        }
    } catch (e) {
        const status = document.getElementById('apiStatus');
        if (status) {
            status.className = 'api-status offline';
            document.getElementById('apiStatusText').textContent = 'API Offline';
        }
        return false;
    }
}

function exportarDados() {
    const data = {
        produtos: DB.produtos, clientes: DB.clientes, vendas: DB.vendas,
        estoque: DB.estoque, empresas: DB.empresas, config: DB.config,
        categorias: DB.categorias, projetos: DB.projetos, ativos: DB.ativos,
        funcionarios: DB.funcionarios, usuarios: DB.usuarios, servicos: DB.servicos,
        timestamp: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `kanawa_backup_${new Date().toISOString().split('T')[0]}.json`;
    link.click();
    showToast('📤 Dados exportados!', 'success');
}

// ============================================================
function renderTopMenu() {
    const container = document.getElementById('topMenu');
    if (!container) return;
    container.innerHTML = '';
    Object.entries(MENU_DATA).forEach(([key, data]) => {
        const btn = document.createElement('button');
        btn.className = 'menu-item';
        btn.dataset.category = key;
        btn.innerHTML = `
            <span class="menu-icon"><i class="fas ${data.icon}"></i></span>
            <span class="menu-label">${data.label}</span>
        `;
        btn.onclick = () => toggleSubmenu(key);
        container.appendChild(btn);
    });
}

function toggleSubmenu(categoryId) {
    const category = MENU_DATA[categoryId];
    if (!category) return;
    if (isSubmenuOpen && currentCategory === categoryId) {
        closeSubmenu();
        return;
    }
    currentCategory = categoryId;
    document.getElementById('submenuCategoryName').textContent = category.label;
    const titleIcon = document.querySelector('#submenuTitle i');
    if (titleIcon) titleIcon.className = `fas ${category.icon}`;
    const grid = document.getElementById('submenuGrid');
    if (!grid) return;
    grid.innerHTML = '';
    category.items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'submenu-item';
        div.innerHTML = `
            <span class="sub-icon"><i class="fas ${item.icon}"></i></span>
            <span class="sub-label">${item.label}</span>
        `;
        div.onclick = () => { openModule(item.id); closeSubmenu(); };
        grid.appendChild(div);
    });
    isSubmenuOpen = true;
    document.getElementById('submenuPanel').style.display = 'block';
    document.getElementById('submenuOverlay').classList.add('active');
    document.querySelectorAll('.menu-item').forEach(el => {
        el.classList.toggle('active', el.dataset.category === categoryId);
    });
}

function closeSubmenu() {
    isSubmenuOpen = false;
    document.getElementById('submenuPanel').style.display = 'none';
    document.getElementById('submenuOverlay').classList.remove('active');
    document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
    currentCategory = null;
}

function filtrarModulos(tipo) {
    const rows = document.querySelectorAll('#screenContainer table tbody tr');
    rows.forEach(row => {
        const tipoRow = row.dataset.tipo;
        if (tipo === 'todos') {
            row.style.display = '';
        } else if (tipo === 'sistema' && tipoRow === 'sistema') {
            row.style.display = '';
        } else if (tipo === 'personalizado' && tipoRow === 'personalizado') {
            row.style.display = '';
        } else {
            row.style.display = 'none';
        }
    });
    showToast(`📋 Filtrando: ${tipo}`, 'info');
}

}

function criarNovoModuloCompleto() {
    const nome = document.getElementById('devModuloNome')?.value?.trim();
    const id = document.getElementById('devModuloId')?.value?.trim();
    const icon = document.getElementById('devModuloIcon')?.value?.trim() || 'fa-puzzle-piece';
    const cor = document.getElementById('devModuloCor')?.value?.trim() || '#6b7280';
    const desc = document.getElementById('devModuloDesc')?.value?.trim() || '';
    const submodulos = document.getElementById('devModuloSubmodulos')?.value?.split('\n').filter(s => s.trim()) || ['Dashboard'];
    
    if (!nome || !id) {
        showToast('⚠️ Nome e identificador são obrigatórios', 'warning');
        return;
    }
    
    if (MENU_DATA[id]) {
        showToast('⚠️ Já existe um módulo do sistema com este identificador', 'warning');
        return;
    }
    
    if (DB.modulosPersonalizados.find(m => m.id === id)) {
        showToast('⚠️ Já existe um módulo personalizado com este identificador', 'warning');
        return;
    }
    
    // Criar módulo personalizado
    const novoModulo = {
        id: id,
        nome: nome,
        icon: icon,
        cor: cor,
        descricao: desc,
        submodulos: submodulos.map(s => ({ id: `${id}-${s.toLowerCase().replace(/[^a-z0-9]/g, '-')}`, label: s.trim() })),
        ativo: true,
        dataCriacao: new Date().toISOString(),
        criadoPor: 'Administrador'
    };
    
    DB.modulosPersonalizados.push(novoModulo);
    DB.save();
    
    // Adicionar ao MENU_DATA para aparecer no menu
    MENU_DATA[id] = {
        icon: icon,
        label: nome,
        color: cor,
        items: submodulos.map(s => ({
            id: `${id}-${s.toLowerCase().replace(/[^a-z0-9]/g, '-')}`,
            icon: icon,
            label: s.trim()
        }))
    };
    
    localStorage.setItem(`kanawa_modulo_${id}_update`, new Date().toISOString());
    localStorage.setItem(`kanawa_modulo_${id}_desc`, desc);
    
    renderTopMenu();
    showToast(`✅ Módulo "${nome}" criado com sucesso!`, 'success');
    adicionarNotificacao('📦 Novo Módulo', `Módulo "${nome}" criado com ${submodulos.length} submódulos`, 'success');
    
    // Limpar campos
    limparCamposCriarModulo();
    openModule('dev-modulos');
}

function abrirModuloPersonalizado(id) {
    const mod = DB.modulosPersonalizados.find(m => m.id === id);

        return;

}

function editarModuloPersonalizado(id) {
    const mod = DB.modulosPersonalizados.find(m => m.id === id);
    if (!mod) {
        showToast('❌ Módulo não encontrado', 'error');
        return;
    }
    
    const novoNome = prompt('Novo nome do módulo:', mod.nome);
    if (novoNome && novoNome.trim()) {
        mod.nome = novoNome.trim();
        if (MENU_DATA[id]) {
            MENU_DATA[id].label = novoNome.trim();
        }
        DB.save();
        renderTopMenu();
        showToast('✅ Módulo atualizado!', 'success');
        openModule('dev-modulos');
    }
}

function excluirModuloPersonalizado(id) {
    if (!confirm(`Tem certeza que deseja excluir o módulo "${DB.modulosPersonalizados.find(m => m.id === id)?.nome || id}"?`)) return;
    
    DB.modulosPersonalizados = DB.modulosPersonalizados.filter(m => m.id !== id);
    delete MENU_DATA[id];
    DB.save();
    renderTopMenu();
    showToast('🗑️ Módulo excluído!', 'success');
    openModule('dev-modulos');
}

function importarDadosCompleto() {
    const input = document.getElementById('importFile');
    const file = input?.files?.[0];
    if (!file) {
        showToast('⚠️ Selecione um arquivo', 'warning');
        return;
    }

    const tipo = document.getElementById('importTipo')?.value || 'auto';
    const modo = document.getElementById('importModo')?.value || 'adicionar';
    const resultadoDiv = document.getElementById('importResultado');
    const resultadoConteudo = document.getElementById('importResultadoConteudo');

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            let dados = [];
            const ext = file.name.split('.').pop().toLowerCase();
            
            if (tipo === 'json' || ext === 'json') {
                dados = JSON.parse(e.target.result);
            } else if (tipo === 'csv' || ext === 'csv') {
                dados = parseCSV(e.target.result);
            } else if (tipo === 'excel' || ['xlsx', 'xls'].includes(ext)) {
                try {
                    const workbook = XLSX.read(e.target.result, { type: 'binary' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    dados = XLSX.utils.sheet_to_json(sheet);
                } catch (err) {
                    throw new Error('Erro ao ler arquivo Excel: ' + err.message);
                }
            } else {
                try { dados = JSON.parse(e.target.result); } 
                catch { 
                    try { dados = parseCSV(e.target.result); }
                    catch { throw new Error('Formato não reconhecido'); }
                }
            }

            if (!Array.isArray(dados) && typeof dados === 'object') {
                let totalImportados = 0;
                let colecoes = [];
                
                Object.keys(dados).forEach(key => {
                    if (Array.isArray(dados[key]) && DB.hasOwnProperty(key)) {
                        colecoes.push(key);
                        const dadosColecao = dados[key];
                        if (modo === 'substituir') {
                            DB[key] = dadosColecao;
                        } else if (modo === 'adicionar') {
                            DB[key] = [...DB[key], ...dadosColecao];
                        } else if (modo === 'mesclar') {
                            dadosColecao.forEach(item => {
                                const existente = DB[key].find(dbItem => dbItem.id === item.id);
                                if (existente) {
                                    Object.assign(existente, item);
                                } else {
                                    DB[key].push(item);
                                }
                            });
                        }
                        totalImportados += dadosColecao.length;
                    }
                });
                
                DB.save();
                registrarImportacao(file.name, totalImportados, 'sucesso');
                
                resultadoDiv.style.display = 'block';
                resultadoConteudo.innerHTML = `
                    <div class="alert alert-success">✅ ${totalImportados} registros importados em ${colecoes.length} coleções!</div>
                    <div style="font-size:0.7rem;color:var(--text-muted);">Coleções: ${colecoes.join(', ')}</div>
                `;
                showToast(`✅ ${totalImportados} registros importados!`, 'success');
                atualizarHistoricoImportacao();
                return;
            }

            if (dados.length === 0) {
                throw new Error('Nenhum dado encontrado');
            }

            const colecao = prompt('Para qual coleção importar?\n' + Object.keys(DB).filter(k => Array.isArray(DB[k])).join(', '), 'produtos');
            if (!colecao || !DB.hasOwnProperty(colecao) || !Array.isArray(DB[colecao])) {
                throw new Error('Coleção inválida');
            }

            if (modo === 'substituir') {
                DB[colecao] = dados;
            } else if (modo === 'adicionar') {
                DB[colecao] = [...DB[colecao], ...dados];
            } else if (modo === 'mesclar') {
                dados.forEach(item => {
                    const existente = DB[colecao].find(dbItem => dbItem.id === item.id);
                    if (existente) {
                        Object.assign(existente, item);
                    } else {
                        DB[colecao].push(item);
                    }
                });
            }
            
            DB.save();
            registrarImportacao(file.name, dados.length, 'sucesso');
            
            resultadoDiv.style.display = 'block';
            resultadoConteudo.innerHTML = `
                <div class="alert alert-success">✅ ${dados.length} registros importados para "${colecao}"!</div>
            `;
            showToast(`✅ ${dados.length} registros importados!`, 'success');
            atualizarHistoricoImportacao();
            
        } catch (error) {
            resultadoDiv.style.display = 'block';
            resultadoConteudo.innerHTML = `
                <div class="alert alert-danger">❌ Erro: ${error.message}</div>
            `;
            registrarImportacao(file.name, 0, 'erro');
            showToast(`❌ Erro: ${error.message}`, 'error');
        }
    };
    
    if (['xlsx', 'xls'].includes(file.name.split('.').pop().toLowerCase())) {
        reader.readAsBinaryString(file);
    } else {
        reader.readAsText(file);
    }
}

function parseCSV(text) {
    const lines = text.split('\n').filter(line => line.trim());
    if (lines.length === 0) return [];
    
    const headers = lines[0].split(',').map(h => h.trim());
    const result = [];
    
    for (let i = 1; i < lines.length; i++) {
        const values = lines[i].split(',').map(v => v.trim());
        const obj = {};
        headers.forEach((h, idx) => {
            obj[h] = values[idx] || '';
        });
        result.push(obj);
    }
    return result;
}

function exportarConteudo(dados, formato, totalRegistros) {
    const nomeArquivo = `kanawa_export_${new Date().toISOString().split('T')[0]}`;
    let blob;
    let extensao;
    
    if (formato === 'json') {
        blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
        extensao = 'json';
    } else if (formato === 'csv') {
        const csv = converterParaCSV(dados);
        blob = new Blob([csv], { type: 'text/csv' });
        extensao = 'csv';
    } else if (formato === 'excel') {
        try {
            const wb = XLSX.utils.book_new();
            Object.keys(dados).forEach(key => {
                if (Array.isArray(dados[key]) && dados[key].length > 0) {
                    const ws = XLSX.utils.json_to_sheet(dados[key]);
                    XLSX.utils.book_append_sheet(wb, ws, key.slice(0, 31));
                }
            });
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            blob = new Blob([wbout], { type: 'application/octet-stream' });
            extensao = 'xlsx';
        } catch (err) {
            showToast(`❌ Erro ao exportar Excel: ${err.message}`, 'error');
            return;
        }
    }
    
    if (!blob) return;
    
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${nomeArquivo}.${extensao}`;
    link.click();
    URL.revokeObjectURL(link.href);
    
    const historico = JSON.parse(localStorage.getItem('kanawa_export_historico') || '[]');
    const id = Date.now().toString(36);
    historico.push({
        id: id,
        data: new Date().toISOString(),
        formato: formato,
        registros: totalRegistros || Object.values(dados).reduce((sum, arr) => sum + (Array.isArray(arr) ? arr.length : 0), 0),
        nome: link.download
    });
    localStorage.setItem('kanawa_export_historico', JSON.stringify(historico));
    
    showToast(`📤 ${totalRegistros || 'Dados'} exportados em ${formato.toUpperCase()}!`, 'success');
    atualizarHistoricoExportacao();
}

function converterParaCSV(dados) {
    let csv = '';
    let first = true;
    Object.keys(dados).forEach(key => {
        if (Array.isArray(dados[key]) && dados[key].length > 0) {
            if (!first) csv += '\n\n';
            csv += `# ${key}\n`;
            const headers = Object.keys(dados[key][0]);
            csv += headers.join(',') + '\n';
            dados[key].forEach(row => {
                csv += headers.map(h => {
                    let val = row[h] || '';
                    if (typeof val === 'string' && (val.includes(',') || val.includes('"'))) {
                        val = `"${val.replace(/"/g, '""')}"`;
                    }
                    return val;
                }).join(',') + '\n';
            });
            first = false;
        }
    });
    return csv;
}

function filtrarLogs(tipo) {
    const rows = document.querySelectorAll('#logTableBody tr');
    rows.forEach(row => {
        if (tipo === 'todos') {
            row.style.display = '';
        } else {
            const acao = row.dataset.acao || '';
            row.style.display = acao.includes(tipo) ? '' : 'none';
        }
    });
    showToast(`📋 Filtrando: ${tipo}`, 'info');

function buscarLogs(query) {
    const rows = document.querySelectorAll('#logTableBody tr');
    const termo = query.toLowerCase().trim();
    rows.forEach(row => {
        const texto = row.textContent.toLowerCase();
        row.style.display = texto.includes(termo) ? '' : 'none';
    });

function filtrarLogsPorData(data) {
    if (!data) {
        document.querySelectorAll('#logTableBody tr').forEach(row => row.style.display = '');
        return;
    }
    const rows = document.querySelectorAll('#logTableBody tr');
    rows.forEach(row => {
        const cell = row.querySelector('td:first-child');
        if (cell) {
            const rowDate = cell.textContent.split(' ')[0];
            row.style.display = rowDate === data ? '' : 'none';
        }

function validarDB() {
    let erros = 0;
    let warnings = 0;
    const resultados = [];
    
    Object.keys(DB).forEach(key => {
        if (Array.isArray(DB[key])) {
            try {
                const arr = DB[key];
                if (arr.length > 0) {
                    const ids = arr.map(item => item.id).filter(id => id !== undefined);
                    const duplicatas = ids.filter((id, idx) => ids.indexOf(id) !== idx);
                    if (duplicatas.length > 0) {
                        warnings++;
                        resultados.push(`⚠️ ${key}: ${duplicatas.length} IDs duplicados`);
                    }
                    const semId = arr.filter(item => item.id === undefined);
                    if (semId.length > 0) {
                        erros++;
                        resultados.push(`❌ ${key}: ${semId.length} itens sem ID`);
                    }
                }
            } catch (e) {
                erros++;
                resultados.push(`❌ ${key}: Erro - ${e.message}`);
            }
        }
    });
    
    let msg = `✅ Validação concluída!\n`;
    msg += `📊 ${Object.keys(DB).filter(k => Array.isArray(DB[k])).length} coleções verificadas\n`;
    msg += `⚠️ ${warnings} avisos\n`;
    msg += `❌ ${erros} erros\n\n`;
    msg += resultados.join('\n');
    
    showToast(`✅ Validação concluída: ${erros} erros, ${warnings} avisos`, erros > 0 ? 'error' : 'success');
    alert(msg);
}

function estatisticasDB() {
    const stats = Object.keys(DB)
        .filter(k => Array.isArray(DB[k]))
        .map(k => ({
            nome: k,
            total: DB[k].length
        }))
        .sort((a, b) => b.total - a.total);
    
    let msg = '📊 ESTATÍSTICAS DO BANCO DE DADOS\n\n';
    msg += `Total de coleções: ${stats.length}\n`;
    msg += `Total de registros: ${stats.reduce((s, i) => s + i.total, 0)}\n\n`;
    msg += '📋 DETALHES POR COLEÇÃO:\n';
    stats.forEach(s => {
        const percent = (s.total / stats.reduce((sum, i) => sum + i.total, 0) * 100).toFixed(1);
        msg += `  ${s.nome}: ${s.total} registros (${percent}%)\n`;
    });
    alert(msg);
}

function ordenarColecoes(tipo) {
    const tbody = document.getElementById('dbTableBody');
    if (!tbody) return;
    const rows = Array.from(tbody.querySelectorAll('tr'));
    rows.sort((a, b) => {
        const aVal = tipo === 'nome' ? a.querySelector('td:first-child')?.textContent || '' : parseInt(a.querySelector('td:nth-child(2)')?.textContent || '0');
        const bVal = tipo === 'nome' ? b.querySelector('td:first-child')?.textContent || '' : parseInt(b.querySelector('td:nth-child(2)')?.textContent || '0');
        if (tipo === 'nome') return aVal.localeCompare(bVal);
        return bVal - aVal;
    });
    rows.forEach(row => tbody.appendChild(row));
}

function criarBackupLocal() {
    try {
        const dataAtual = new Date();
        const nomeBackup = `backup_${dataAtual.toISOString().split('T')[0]}_${dataAtual.getTime()}.json`;
        
        const dadosBackup = {
            versao: APP_VERSION,
            data: dataAtual.toISOString(),
            dados: {}
        };
        
        Object.keys(DB).forEach(key => {
            if (Array.isArray(DB[key]) && DB[key].length > 0) {
                dadosBackup.dados[key] = DB[key];
            }
        });
        
        const jsonBackup = JSON.stringify(dadosBackup, null, 2);
        const tamanhoBytes = new Blob([jsonBackup]).size;
        const tamanhoKB = (tamanhoBytes / 1024).toFixed(1);

        const backupId = Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        DB.backups.push({
            id: backupId,
            nome: nomeBackup,
            data: dataAtual.toISOString(),
            tamanho: `${tamanhoKB} KB`,
            dados: jsonBackup
        });
        DB.save();

        const blob = new Blob([jsonBackup], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = nomeBackup;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);

        showToast(`✅ Backup "${nomeBackup}" criado! (${tamanhoKB} KB)`, 'success');
        adicionarNotificacao('💾 Backup', `Backup "${nomeBackup}" criado com sucesso`, 'success');
        openModule('backup');
    } catch (error) {
        showToast(`❌ Erro ao criar backup: ${error.message}`, 'error');
    }
}

function baixarBackupLocal(backupId) {
    const backup = DB.backups.find(b => b.id === backupId);
    if (!backup) {
        showToast('❌ Backup não encontrado', 'error');
        return;
    }
    try {
        const blob = new Blob([backup.dados], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = backup.nome;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
        showToast(`📥 Backup "${backup.nome}" baixado!`, 'success');
    } catch (error) {
        showToast(`❌ Erro ao baixar: ${error.message}`, 'error');
    }
}

function excluirBackupLocal(backupId) {
    if (!confirm('Tem certeza que deseja excluir este backup?')) return;
    DB.backups = DB.backups.filter(b => b.id !== backupId);
    DB.save();
    showToast('🗑️ Backup excluído!', 'success');
    openModule('backup');
}

function restaurarBackupLocal() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                const dados = JSON.parse(ev.target.result);
                if (!dados.dados) {
                    showToast('❌ Arquivo de backup inválido', 'error');
                    return;
                }
                if (!confirm(`⚠️ Isso substituirá todos os dados atuais por "${file.name}". Tem certeza?`)) {
                    return;
                }
                Object.keys(dados.dados).forEach(key => {
                    if (DB.hasOwnProperty(key) && Array.isArray(DB[key])) {
                        DB[key] = dados.dados[key];
                    }
                });
                DB.save();
                showToast(`✅ Backup "${file.name}" restaurado com sucesso!`, 'success');
                adicionarNotificacao('🔄 Restauração', `Backup "${file.name}" restaurado`, 'success');
                setTimeout(() => location.reload(), 1500);
            } catch (error) {
                showToast(`❌ Erro ao restaurar: ${error.message}`, 'error');
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

function limparBackupsLocais() {
    if (!confirm('⚠️ Tem certeza que deseja excluir TODOS os backups locais?')) return;
    DB.backups = [];
    DB.save();
    showToast('🗑️ Todos os backups locais foram removidos!', 'success');
    openModule('backup');
}

            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;">
                ${['Últimos 7 dias', 'Último mês', 'Último trimestre'].map(periodo => {
                    const filtro = vendas.filter(v => {
                        const data = new Date(v.data);
                        const agora = new Date();
                        if (periodo === 'Últimos 7 dias') return (agora - data) / (1000*60*60*24) <= 7;
                        if (periodo === 'Último mês') return (agora - data) / (1000*60*60*24) <= 30;
                        return (agora - data) / (1000*60*60*24) <= 90;
                    });
                    const total = filtro.reduce((sum, v) => sum + v.total, 0);
                    return `
                        <div style="background:var(--bg);padding:12px;border-radius:var(--radius-sm);text-align:center;">
                            <div style="font-size:0.6rem;color:var(--text-muted);">${periodo}</div>
                            <div style="font-weight:700;font-size:0.9rem;">${formatCurrency(total)}</div>
                            <div style="font-size:0.55rem;color:var(--text-muted);">${filtro.length} vendas</div>
                        </div>
                    `;
                }).join('')}
            </div>
        </div>
    `;
}

function renderBIGraficos() {

    const dados = {
        periodo: periodo,

        clientes: DB.clientes,
        produtos: DB.produtos,
        vendas: DB.vendas.filter(v => v.data.startsWith(periodo)),
        compras: DB.compras.filter(c => c.data.startsWith(periodo)),
        formato: formato,
        dataGeracao: new Date().toISOString()
    };
    
    const resultado = document.getElementById('saftResultado');
    const conteudo = document.getElementById('saftConteudo');
    if (resultado && conteudo) {
        resultado.style.display = 'block';

function calcularIRT() {
    const selecionados = document.querySelectorAll('.irtFunc:checked');
    if (selecionados.length === 0) {
        showToast('⚠️ Selecione pelo menos um funcionário', 'warning');
        return;
    }
    
    const resultado = document.getElementById('irtResultado');
    const conteudo = document.getElementById('irtConteudo');
    if (resultado && conteudo) {
        resultado.style.display = 'block';
        let total = 0;
        const detalhes = Array.from(selecionados).map(el => {
            const func = DB.funcionarios.find(f => f.id == el.value);
            const salario = func?.salario || 0;
            const irt = salario * 0.1; // 10% de exemplo
            total += irt;
            return `${func?.nome}: ${formatCurrency(salario)} → IRT: ${formatCurrency(irt)}`;
        }).join('<br>');
        
        conteudo.innerHTML = `
            <div class="alert alert-info">💰 Total IRT Calculado: ${formatCurrency(total)}</div>
            <div style="font-size:0.7rem;margin-top:8px;">${detalhes}</div>
            <div style="margin-top:8px;">
                <button class="btn btn-success btn-sm" onclick="gerarDeclaracaoIRT()"><i class="fas fa-file-export"></i> Gerar Declaração</button>
            </div>
        `;
    }
    showToast('🧮 IRT calculado!', 'success');
}

function salvarPoliticaSenha() {
    const politica = {
        tamanhoMinimo: parseInt(document.getElementById('politicaTamanho')?.value) || 8,
        exigeMaiuscula: document.getElementById('politicaMaiuscula')?.checked || false,
        exigeMinuscula: document.getElementById('politicaMinuscula')?.checked || false,
        exigeNumero: document.getElementById('politicaNumero')?.checked || false,
        exigeEspecial: document.getElementById('politicaEspecial')?.checked || false,
        expiracaoDias: parseInt(document.getElementById('politicaExpiracao')?.value) || 90,
        historico: parseInt(document.getElementById('politicaHistorico')?.value) || 5,
        ativo: document.getElementById('politicaStatus')?.value === 'true'
    };
    if (DB.politicasSenha.length === 0) {
        DB.politicasSenha.push({ id: 1, ...politica });
    } else {
        Object.assign(DB.politicasSenha[0], politica);
    }
    DB.save();
    showToast('✅ Política de senhas salva!', 'success');
}

function testarSenha() {
    const senha = prompt('🔑 Digite uma senha para testar:');
    if (!senha) return;
    const politica = DB.politicasSenha[0] || { tamanhoMinimo: 8, exigeMaiuscula: true, exigeMinuscula: true, exigeNumero: true, exigeEspecial: true };
    let erros = [];
    if (senha.length < politica.tamanhoMinimo) erros.push(`Mínimo ${politica.tamanhoMinimo} caracteres`);
    if (politica.exigeMaiuscula && !/[A-Z]/.test(senha)) erros.push('Falta maiúscula');
    if (politica.exigeMinuscula && !/[a-z]/.test(senha)) erros.push('Falta minúscula');
    if (politica.exigeNumero && !/[0-9]/.test(senha)) erros.push('Falta número');
    if (politica.exigeEspecial && !/[!@#$%^&*(),.?":{}|<>]/.test(senha)) erros.push('Falta caractere especial');
    
    if (erros.length === 0) {
        showToast('✅ Senha válida!', 'success');
    } else {
        showToast(`❌ ${erros.join(', ')}`, 'error');
    }
}

function ordenarColecoes(tipo) {
    const tbody = document.getElementById('dbTableBody');
    if (!tbody) return;
    const rows = Array.from(tbody.querySelectorAll('tr'));
    rows.sort((a, b) => {
        const aVal = tipo === 'nome' ? a.querySelector('td:first-child')?.textContent || '' : parseInt(a.querySelector('td:nth-child(2)')?.textContent || '0');
        const bVal = tipo === 'nome' ? b.querySelector('td:first-child')?.textContent || '' : parseInt(b.querySelector('td:nth-child(2)')?.textContent || '0');
        if (tipo === 'nome') return aVal.localeCompare(bVal);
        return bVal - aVal;
    });
    rows.forEach(row => tbody.appendChild(row));
}

function enviarSuporte() {
    showToast('📤 Mensagem enviada para o suporte!', 'success');
}

function avaliarFeedback(estrelas) {
    document.querySelectorAll('#starRating span').forEach(el => {
        const value = parseInt(el.dataset.value);
        el.style.color = value <= estrelas ? '#f59e0b' : 'var(--text-muted)';
    });
    showToast(`⭐ Avaliação: ${estrelas} estrelas`, 'info');
}

function enviarFeedback() {
    const comentario = document.getElementById('feedbackComentario')?.value;
    const avaliacao = document.querySelectorAll('#starRating span[style*="f59e0b"]').length;
    if (!comentario && avaliacao === 0) {
        showToast('⚠️ Por favor, avalie ou deixe um comentário', 'warning');
        return;
    }
    showToast('✅ Feedback enviado! Obrigado!', 'success');
    document.getElementById('feedbackComentario').value = '';
    document.querySelectorAll('#starRating span').forEach(el => el.style.color = 'var(--text-muted)');
}

function verFeedbacks() {
    showToast('📋 Exibindo feedbacks recebidos', 'info');
}

function configurarSerpAPI() {
    const key = prompt('🔑 Insira sua chave SerpAPI:');
    if (key && key.trim()) {
        DB.serpapiKey = key.trim();
        localStorage.setItem('serpapi_key', key.trim());
        showToast('✅ Chave SerpAPI configurada!', 'success');
    }
}

function buscarSerpAPI() {
    const query = document.getElementById('serpapiQuery')?.value || 'pesquisa';
    const location = document.getElementById('serpapiLocation')?.value || 'Angola';
    const num = parseInt(document.getElementById('serpapiNum')?.value) || 5;
    
    showToast(`🔍 Buscando "${query}" em ${location}...`, 'info');
    
    // Simulação de resultados
    const resultados = [
        { title: 'Resultado 1 - ' + query, link: 'https://exemplo.com/1', description: 'Descrição do primeiro resultado' },
        { title: 'Resultado 2 - ' + query, link: 'https://exemplo.com/2', description: 'Descrição do segundo resultado' },
        { title: 'Resultado 3 - ' + query, link: 'https://exemplo.com/3', description: 'Descrição do terceiro resultado' },
    ].slice(0, num);
    
    const resultadoDiv = document.getElementById('serpapiResultado');
    const conteudo = document.getElementById('serpapiConteudo');
    if (resultadoDiv && conteudo) {
        resultadoDiv.style.display = 'block';
        conteudo.innerHTML = `
            <div class="alert alert-success">✅ ${resultados.length} resultados encontrados</div>
            ${resultados.map(r => `
                <div class="ddg-result">
                    <strong style="font-size:0.8rem;">${r.title}</strong>
                    <div style="font-size:0.6rem;color:var(--text-muted);">${r.link}</div>
                    <div style="font-size:0.7rem;margin-top:4px;">${r.description}</div>
                </div>
            `).join('')}
            <div style="font-size:0.6rem;color:var(--text-muted);margin-top:8px;">
                Fonte: SerpAPI (simulação) | Local: ${location}
            </div>
        `;
    }
    showToast('✅ Pesquisa concluída!', 'success');
}

function analisarSerpAPI() {
    showToast('📊 Analisando resultados...', 'info');
    setTimeout(() => showToast('✅ Análise concluída!', 'success'), 2000);
}

function buscarDDGMaps() {

}

function geolocalizarDDG() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                document.getElementById('ddgMapQuery').value = `${lat}, ${lng}`;
                showToast(`📍 Localização: ${lat}, ${lng}`, 'success');
                buscarDDGMaps();
            },
            () => showToast('❌ Não foi possível obter localização', 'error')
        );
    } else {
        showToast('❌ Geolocalização não suportada', 'error');
    }
}

function importarAudiobooksGoogle() {
    showToast('🎧 Importando audiobooks da Google Play...', 'info');
    // Simular importação
    const novos = [
        { id: Date.now().toString(36), titulo: 'O Poder do Hábito', autor: 'Charles Duhigg', avaliacao: '4.7', avaliacoes: 1200, preco: 0 },
        { id: (Date.now()+1).toString(36), titulo: 'Como Fazer Amigos', autor: 'Dale Carnegie', avaliacao: '4.8', avaliacoes: 2000, preco: 0 },
        { id: (Date.now()+2).toString(36), titulo: 'A Sutil Arte de Ligar o F*da-se', autor: 'Mark Manson', avaliacao: '4.6', avaliacoes: 1500, preco: 0 }
    ];
    novos.forEach(a => {
        if (!DB.audiobooks.find(ex => ex.titulo === a.titulo)) {
            DB.audiobooks.push(a);
        }
    });
    DB.save();
    showToast(`✅ ${novos.length} audiobooks importados!`, 'success');
    openModule('google-play-audiobooks');
}

function novoAudiobook() {
    const titulo = prompt('📚 Título do audiobook:');
    if (!titulo) return;
    const autor = prompt('✍️ Autor:');
    const audiobook = {
        id: Date.now().toString(36),
        titulo: titulo,
        autor: autor || 'Autor desconhecido',
        avaliacao: '4.0',
        avaliacoes: 0,
        preco: 0,
        data: new Date().toISOString()
    };
    DB.audiobooks.push(audiobook);
    DB.save();
    showToast(`✅ Audiobook "${titulo}" adicionado!`, 'success');
    openModule('google-play-audiobooks');
}

function ouvirAudiobook(id) {
    const audiobook = DB.audiobooks.find(a => a.id === id);
    if (audiobook) {
        showToast(`🎧 Reproduzindo: ${audiobook.titulo}`, 'info');
    } else {
        showToast('❌ Audiobook não encontrado', 'error');
    }
}

function excluirAudiobook(id) {
    if (!confirm('Tem certeza que deseja excluir este audiobook?')) return;
    DB.audiobooks = DB.audiobooks.filter(a => a.id !== id);
    DB.save();
    showToast('🗑️ Audiobook excluído!', 'success');
    openModule('google-play-audiobooks');
}

function enviarWhatsApp() {
    const numero = document.getElementById('whatsappNumero')?.value || '+244 900 000 000';
    const mensagem = document.getElementById('whatsappMensagem')?.value || 'Olá!';
    
    if (!numero || numero.length < 8) {
        showToast('⚠️ Número inválido', 'warning');
        return;
    }
    
    showToast(`💬 Enviando mensagem para ${numero}...`, 'info');
    
    // Simular envio
    const msg = {
        id: Date.now().toString(36),
        para: numero,
        mensagem: mensagem,
        data: new Date().toISOString(),
        status: 'entregue'
    };
    DB.mensagensWhatsApp.push(msg);
    DB.save();
    
    // Abrir WhatsApp Web
    const url = `https://wa.me/${numero.replace(/\D/g, '')}?text=${encodeURIComponent(mensagem)}`;
    window.open(url, '_blank');
    
    showToast('✅ Mensagem enviada via WhatsApp!', 'success');
}

function conectarWhatsApp() {
    showToast('🔗 Conectando ao WhatsApp...', 'info');
    setTimeout(() => {
        showToast('✅ WhatsApp conectado!', 'success');
        // Abrir WhatsApp Web
        window.open('https://web.whatsapp.com', '_blank');
    }, 1500);
}

function templateWhatsApp() {
    const templates = [
        'Olá! Bem-vindo ao Kanawa Soft! 🚀',
        'Sua encomenda já está pronta! 📦',
        'Obrigado pela sua compra! 🛍️',
        'Temos uma nova promoção para você! 🎉'
    ];
    const template = prompt('📋 Selecione um template:\n' + templates.map((t, i) => `${i+1}. ${t}`).join('\n'));
    if (template) {
        const idx = parseInt(template) - 1;
        if (idx >= 0 && idx < templates.length) {
            document.getElementById('whatsappMensagem').value = templates[idx];
            showToast('📋 Template carregado!', 'success');
        }
    }
}

    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `auditoria_${new Date().toISOString().split('T')[0]}.json`;
    link.click();
    showToast('📤 Auditoria exportada!', 'success');
}

function novoUsuario() {
    const nome = prompt('👤 Nome do usuário:');
    if (!nome) return;
    const email = prompt('📧 Email:');
    if (!email) return;
    const usuario = {
        id: Date.now().toString(36),
        nome: nome,
        email: email,
        perfil: 'user',
        ativo: true,
        data: new Date().toISOString()
    };
    DB.usuarios.push(usuario);
    DB.save();
    showToast(`✅ Usuário "${nome}" criado!`, 'success');
    openModule('usuarios');
}

function editarUsuario(id) {
    const usuario = DB.usuarios.find(u => u.id === id);
    if (!usuario) { showToast('❌ Usuário não encontrado', 'error'); return; }
    const novoNome = prompt('Novo nome:', usuario.nome);
    if (novoNome) {
        usuario.nome = novoNome;
        DB.save();
        showToast('✅ Usuário atualizado!', 'success');
        openModule('usuarios');
    }
}

function excluirUsuario(id) {
    if (!confirm('Tem certeza que deseja excluir este usuário?')) return;
    DB.usuarios = DB.usuarios.filter(u => u.id !== id);
    DB.save();
    showToast('🗑️ Usuário excluído!', 'success');
    openModule('usuarios');
}

function uploadDocumento() {
    document.getElementById('uploadFileInput')?.click();
}

function processarUploadDocumento(input) {
    const files = input?.files || [];
    if (files.length === 0) {
        showToast('⚠️ Selecione um arquivo', 'warning');
        return;
    }
    
    const categoria = document.getElementById('uploadCategoria')?.value || 'geral';
    const privacidade = document.getElementById('uploadPrivacidade')?.value || 'publico';
    
    Array.from(files).forEach(file => {
        const doc = {
            id: Date.now().toString(36) + Math.random().toString(36).substr(2, 3),
            nome: file.name,
            tipo: file.type || 'Desconhecido',
            tamanho: (file.size / 1024).toFixed(1) + ' KB',
            categoria: categoria,
            privacidade: privacidade,
            data: new Date().toISOString(),
            usuario: JSON.parse(localStorage.getItem('kanawa_user') || '{"name":"Administrador"}').name
        };
        DB.documentos.push(doc);
    });
    DB.save();
    
    showToast(`✅ ${files.length} documento(s) enviado(s)!`, 'success');
    openModule('documentos');
}

function organizarDocumentos() {
    showToast('📁 Organizando documentos...', 'info');
    setTimeout(() => showToast('✅ Documentos organizados!', 'success'), 1000);
}

function buscarDocumentos() {
    const termo = prompt('🔍 Buscar documento:');
    if (termo) {
        const docs = DB.documentos.filter(d => d.nome.toLowerCase().includes(termo.toLowerCase()));
        showToast(`📋 ${docs.length} documentos encontrados`, 'info');
    }
}

function visualizarDocumento(id) {
    const doc = DB.documentos.find(d => d.id === id);
    if (doc) {
        showToast(`📄 Visualizando: ${doc.nome}`, 'info');
    } else {
        showToast('❌ Documento não encontrado', 'error');
    }
}

function excluirDocumento(id) {
    if (!confirm('Tem certeza que deseja excluir este documento?')) return;
    DB.documentos = DB.documentos.filter(d => d.id !== id);
    DB.save();
    showToast('🗑️ Documento excluído!', 'success');
    openModule('documentos');
}

// ============================================================
// 49. FUNÇÕES DE AÇÃO - OCR
// ============================================================

function processarOCR(input) {
    const file = input?.files?.[0];
    if (!file) {
        // Verificar se já há um arquivo selecionado
        const inputFile = document.getElementById('ocrFileInput');
        if (inputFile?.files?.length > 0) {
            processarOCR(inputFile);
        } else {
            showToast('⚠️ Selecione uma imagem', 'warning');
        }
        return;
    }
    
    showToast('🔄 Processando OCR...', 'info');
    
    const reader = new FileReader();
    reader.onload = function(e) {
        const imageData = e.target.result;
        const img = new Image();
        img.onload = function() {
            Tesseract.recognize(
                img,
                'por',
                {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            // Atualizar progresso
                        }
                    }
                }
            ).then(({ data: { text } }) => {
                const resultadoDiv = document.getElementById('ocrResultado');
                const conteudo = document.getElementById('ocrConteudo');
                if (resultadoDiv && conteudo) {
                    resultadoDiv.style.display = 'block';
                    conteudo.textContent = text || 'Nenhum texto encontrado na imagem.';
                }
                showToast('✅ OCR concluído!', 'success');
                adicionarNotificacao('📄 OCR Concluído', 'Texto extraído com sucesso', 'success');
            }).catch(err => {
                showToast(`❌ Erro no OCR: ${err.message}`, 'error');
            });
        };
        img.src = imageData;
    };
    reader.readAsDataURL(file);
}

function copiarOCRTEXTO() {

function novoServico() {
    const nome = prompt('📝 Nome do serviço:');
    if (!nome) return;
    const preco = parseFloat(prompt('💰 Preço (AOA):')) || 0;
    const servico = {
        id: Date.now().toString(36),
        codigo: `SRV-${String(DB.servicos.length + 1).padStart(4, '0')}`,
        nome: nome,
        descricao: prompt('📝 Descrição:') || '',
        preco: preco,
        duracao: prompt('⏱️ Duração (ex: 2h):') || '1h',
        status: 'ativo'
    };
    DB.servicos.push(servico);
    DB.save();
    showToast(`✅ Serviço "${nome}" criado!`, 'success');
    openModule('servicos');
}

function editarServico(id) {
    const servico = DB.servicos.find(s => s.id === id);
    if (!servico) { showToast('❌ Serviço não encontrado', 'error'); return; }
    const novoNome = prompt('Novo nome:', servico.nome);
    if (novoNome) {
        servico.nome = novoNome;
        DB.save();
        showToast('✅ Serviço atualizado!', 'success');
        openModule('servicos');
    }
}

function excluirServico(id) {
    if (!confirm('Tem certeza que deseja excluir este serviço?')) return;
    DB.servicos = DB.servicos.filter(s => s.id !== id);
    DB.save();
    showToast('🗑️ Serviço excluído!', 'success');
    openModule('servicos');
}
