function adicionarAoCarrinhoEcommerce(id) {
    const produto = DB.produtos.find(p => p.id === id) || DB.ecommerceProdutos?.find(p => p.id === id);
    if (!produto) { showToast('❌ Produto não encontrado', 'error'); return; }
    
    if (!DB.ecommerceCarrinhos) DB.ecommerceCarrinhos = [];
    const existente = DB.ecommerceCarrinhos.find(i => i.id === id);
    if (existente) {
        existente.quantidade += 1;
    } else {
        DB.ecommerceCarrinhos.push({
            id: produto.id,
            nome: produto.nome,
            preco: produto.preco,
            quantidade: 1
        });
    }
    DB.save();
    showToast(`🛒 ${produto.nome} adicionado ao carrinho!`, 'success');
}

function removerDoCarrinhoEcommerce(id) {
    DB.ecommerceCarrinhos = DB.ecommerceCarrinhos.filter(i => i.id !== id);
    DB.save();
    showToast('🗑️ Item removido do carrinho', 'success');
    openModule('ecommerce-carrinho');
}

function finalizarPedidoEcommerce() {
    const carrinho = DB.ecommerceCarrinhos || [];
    if (carrinho.length === 0) { showToast('⚠️ Carrinho vazio', 'warning'); return; }
    
    const total = carrinho.reduce((s, i) => s + (i.preco * i.quantidade), 0);
    const pedido = {
        id: Date.now().toString(36),
        cliente: prompt('👤 Nome do cliente:') || 'Anônimo',
        itens: [...carrinho],
        total: total,
        data: new Date().toISOString(),
        status: 'pendente'
    };
    DB.ecommercePedidos.push(pedido);
    DB.ecommerceCarrinhos = [];
    DB.save();
    showToast(`✅ Pedido #${pedido.id} finalizado! Total: ${formatCurrency(total)}`, 'success');
    openModule('ecommerce-pedidos');
}

function detalhesPedido(id) {
    const pedido = DB.ecommercePedidos.find(p => p.id === id);
    if (!pedido) { showToast('❌ Pedido não encontrado', 'error'); return; }
    showToast(`📋 Pedido #${id}: ${pedido.itens.length} itens, ${formatCurrency(pedido.total)}`, 'info');
}

function atualizarStatusPedido(id) {
    const pedido = DB.ecommercePedidos.find(p => p.id === id);
    if (!pedido) { showToast('❌ Pedido não encontrado', 'error'); return; }
    const status = prompt('📋 Novo status (pendente, enviado, entregue, cancelado):', pedido.status || 'pendente');
    if (status) {
        pedido.status = status;
        DB.save();
        showToast(`✅ Status atualizado para: ${status}`, 'success');
        openModule('ecommerce-pedidos');
    }
}

function adicionarProdutoEcommerce() {
    const id = prompt('📦 ID do produto (ou nome para criar):');
    if (!id) return;
    const produto = DB.produtos.find(p => p.id == id || p.nome.toLowerCase().includes(id.toLowerCase()));
    if (!produto) {
        // Criar novo produto
        const nome = prompt('📝 Nome do produto:');
        if (!nome) return;
        const preco = parseFloat(prompt('💰 Preço:')) || 0;
        const novo = {
            id: Date.now().toString(36),
            nome: nome,
            preco: preco,
            estoque: parseInt(prompt('📦 Estoque:')) || 0,
            ativo: true
        };
        DB.ecommerceProdutos.push(novo);
        DB.save();
        showToast(`✅ Produto "${nome}" adicionado ao e-commerce!`, 'success');
    } else {
        if (!DB.ecommerceProdutos) DB.ecommerceProdutos = [];
        if (!DB.ecommerceProdutos.find(p => p.id === produto.id)) {
            DB.ecommerceProdutos.push({ ...produto, ativo: true });
            DB.save();
            showToast(`✅ Produto "${produto.nome}" adicionado ao e-commerce!`, 'success');
        } else {
            showToast('ℹ️ Produto já está no e-commerce', 'info');
        }
    }
    openModule('ecommerce-produtos');
}

function sincronizarProdutosEcommerce() {
    showToast('🔄 Sincronizando produtos com o estoque...', 'info');
    setTimeout(() => showToast('✅ Produtos sincronizados!', 'success'), 1500);
}

function editarProdutoEcommerce(id) {
    const produto = DB.ecommerceProdutos?.find(p => p.id === id) || DB.produtos.find(p => p.id === id);
    if (!produto) { showToast('❌ Produto não encontrado', 'error'); return; }
    const novoPreco = parseFloat(prompt('💰 Novo preço:', produto.preco));
    if (novoPreco >= 0) {
        produto.preco = novoPreco;
        DB.save();
        showToast('✅ Produto atualizado!', 'success');
        openModule('ecommerce-produtos');
    }
}

function toggleProdutoEcommerce(id) {
    const produto = DB.ecommerceProdutos?.find(p => p.id === id);
    if (!produto) { showToast('❌ Produto não encontrado', 'error'); return; }
    produto.ativo = produto.ativo !== false ? false : true;
    DB.save();
    showToast(`✅ Produto ${produto.ativo !== false ? 'ativado' : 'desativado'}!`, 'success');
    openModule('ecommerce-produtos');
}

function configurarPagamento() {

}

function rastrearEncomenda() {
    const codigo = document.getElementById('rastreioCodigo')?.value;
    if (!codigo) { showToast('⚠️ Informe o código de rastreio', 'warning'); return; }
    
    const resultado = document.getElementById('rastreioResultado');

function editarFidelidade(id) {

    const novoNivel = prompt('📋 Nível (bronze, prata, ouro):', fidelidade.nivel);

        showToast('✅ Nível atualizado!', 'success');
        openModule('clientes-fidelidade');
    }
}

function adicionarPontosFidelidade(id) {
    const fidelidade = DB.fidelidade.find(f => f.id === id);
    if (!fidelidade) { showToast('❌ Cliente não encontrado', 'error'); return; }
    const pontos = parseInt(prompt('➕ Pontos a adicionar:')) || 0;
    fidelidade.pontos = (fidelidade.pontos || 0) + pontos;
    // Atualizar nível baseado nos pontos
    if (fidelidade.pontos >= 1000) fidelidade.nivel = 'ouro';
    else if (fidelidade.pontos >= 500) fidelidade.nivel = 'prata';
    else fidelidade.nivel = 'bronze';
    DB.save();
    showToast(`✅ ${pontos} pontos adicionados! Total: ${fidelidade.pontos}`, 'success');
    openModule('clientes-fidelidade');
}

function adicionarAoCarrinhoPDV(id) {
    const produto = DB.produtos.find(p => p.id === id);
    if (!produto) { showToast('❌ Produto não encontrado', 'error'); return; }
    
    const existente = pdvCart.find(i => i.id === id);
    if (existente) {
        existente.quantidade += 1;
    } else {
        pdvCart.push({
            id: produto.id,
            nome: produto.nome,
            preco: produto.preco,
            quantidade: 1
        });
    }
    atualizarCarrinhoPDV();
    showToast(`🛒 ${produto.nome} adicionado ao carrinho!`, 'success');
}

function removerDoCarrinhoPDV(id) {
    pdvCart = pdvCart.filter(i => i.id !== id);
    atualizarCarrinhoPDV();
    showToast('🗑️ Item removido', 'info');
}

function atualizarCarrinhoPDV() {
    const container = document.getElementById('pdvCarrinho');
    const totalEl = document.getElementById('pdvTotal');
    if (!container) return;
    
    const total = pdvCart.reduce((s, i) => s + (i.preco * i.quantidade), 0);
    
    container.innerHTML = pdvCart.map(i => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border);font-size:0.7rem;">
            <span>${i.nome} x${i.quantidade}</span>
            <span style="font-weight:600;">${formatCurrency(i.preco * i.quantidade)}</span>
            <button class="btn btn-danger btn-sm" onclick="removerDoCarrinhoPDV('${i.id}')">✕</button>
        </div>
    `).join('') || '<div style="text-align:center;padding:10px;color:var(--text-muted);font-size:0.7rem;">Carrinho vazio</div>';
    
    if (totalEl) totalEl.textContent = formatCurrency(total);
}

function finalizarVendaPDV() {
    if (pdvCart.length === 0) { showToast('⚠️ Carrinho vazio', 'warning'); return; }
    
    const total = pdvCart.reduce((s, i) => s + (i.preco * i.quantidade), 0);
    const cliente = document.getElementById('pdvCliente')?.value || 'Cliente Anônimo';
    const pagamento = document.getElementById('pdvPagamento')?.value || 'Dinheiro';
    
    const venda = {
        id: DB.vendas.length + 1,
        cliente: cliente,
        data: new Date().toISOString(),
        total: total,
        status: 'pago',
        pagamento: pagamento,
        vendedor: JSON.parse(localStorage.getItem('kanawa_user') || '{"name":"Administrador"}').name,
        itens: [...pdvCart]
    };
    DB.vendas.push(venda);
    
    // Atualizar estoque
    pdvCart.forEach(item => {
        const estoque = DB.estoque.find(e => e.produtoId === item.id);
        if (estoque) {
            estoque.quantidade -= item.quantidade;
        }
        const produto = DB.produtos.find(p => p.id === item.id);
        if (produto) {
            produto.estoque = (produto.estoque || 0) - item.quantidade;
        }
    });
    
    DB.save();
    pdvCart = [];
    atualizarCarrinhoPDV();
    
    showToast(`✅ Venda finalizada! Total: ${formatCurrency(total)}`, 'success');
    adicionarNotificacao('💰 Venda', `Venda de ${formatCurrency(total)} para ${cliente}`, 'success');
    
    // Imprimir comprovante
    imprimirComprovante(venda);
}

function imprimirComprovante(venda) {
    showToast('🖨️ Imprimindo comprovante...', 'info');
    // Simulação de impressão
    setTimeout(() => showToast('✅ Comprovante impresso!', 'success'), 1000);
}

    const nome = document.getElementById('pdvClienteNome')?.value?.trim();

let novaVendaItens = [];

function adicionarItemNovaVenda() {
    const produtoId = document.getElementById('novaVendaProduto')?.value;
    const qtd = parseInt(document.getElementById('novaVendaQtd')?.value) || 1;
    const produto = DB.produtos.find(p => p.id == produtoId);
    if (!produto) { showToast('❌ Produto não encontrado', 'error'); return; }
    
    const existente = novaVendaItens.find(i => i.id === produtoId);
    if (existente) {
        existente.quantidade += qtd;
    } else {
        novaVendaItens.push({
            id: produtoId,
            nome: produto.nome,
            preco: produto.preco,
            quantidade: qtd
        });
    }
    atualizarNovaVenda();
    showToast(`✅ ${produto.nome} adicionado!`, 'success');
}

function atualizarNovaVenda() {
    const container = document.getElementById('novaVendaItens');
    const totalEl = document.getElementById('novaVendaTotal');
    if (!container) return;
    
    const total = novaVendaItens.reduce((s, i) => s + (i.preco * i.quantidade), 0);
    
    container.innerHTML = novaVendaItens.map(i => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border);font-size:0.7rem;">
            <span>${i.nome} x${i.quantidade}</span>
            <span style="font-weight:600;">${formatCurrency(i.preco * i.quantidade)}</span>
            <button class="btn btn-danger btn-sm" onclick="removerItemNovaVenda('${i.id}')">✕</button>
        </div>
    `).join('') || '<div style="text-align:center;color:var(--text-muted);font-size:0.7rem;">Nenhum item adicionado</div>';
    
    if (totalEl) totalEl.textContent = formatCurrency(total);
}

function removerItemNovaVenda(id) {
    novaVendaItens = novaVendaItens.filter(i => i.id !== id);
    atualizarNovaVenda();
    showToast('🗑️ Item removido', 'info');
}

function finalizarNovaVenda() {
    if (novaVendaItens.length === 0) { showToast('⚠️ Adicione itens à venda', 'warning'); return; }
    
    const cliente = document.getElementById('novaVendaCliente')?.value || 'Cliente Anônimo';
    const pagamento = document.getElementById('novaVendaPagamento')?.value || 'Dinheiro';
    const total = novaVendaItens.reduce((s, i) => s + (i.preco * i.quantidade), 0);
    
    const venda = {
        id: DB.vendas.length + 1,
        cliente: cliente,
        data: new Date().toISOString(),
        total: total,
        status: 'pago',
        pagamento: pagamento,
        vendedor: JSON.parse(localStorage.getItem('kanawa_user') || '{"name":"Administrador"}').name,
        itens: [...novaVendaItens]
    };
    DB.vendas.push(venda);
    
    // Atualizar estoque
    novaVendaItens.forEach(item => {
        const estoque = DB.estoque.find(e => e.produtoId == item.id);
        if (estoque) {
            estoque.quantidade -= item.quantidade;
        }
        const produto = DB.produtos.find(p => p.id == item.id);
        if (produto) {
            produto.estoque = (produto.estoque || 0) - item.quantidade;
        }
    });
    
    DB.save();
    novaVendaItens = [];
    atualizarNovaVenda();
    
    showToast(`✅ Venda finalizada! Total: ${formatCurrency(total)}`, 'success');
    adicionarNotificacao('💰 Venda', `Venda de ${formatCurrency(total)} para ${cliente}`, 'success');
}

function limparNovaVenda() {
    novaVendaItens = [];
    atualizarNovaVenda();
    showToast('🧹 Limpo!', 'info');
}

function salvarAjusteEstoque() {
    const produtoId = document.getElementById('ajusteProduto')?.value;
    const quantidade = parseInt(document.getElementById('ajusteQuantidade')?.value);
    const motivo = document.getElementById('ajusteMotivo')?.value || 'Ajuste manual';
    
    if (!produtoId || isNaN(quantidade) || quantidade < 0) {
        showToast('⚠️ Quantidade inválida', 'warning');
        return;
    }
    
    const estoque = DB.estoque.find(e => e.produtoId == produtoId);
    if (estoque) {
        estoque.quantidade = quantidade;
    } else {
        DB.estoque.push({ produtoId: parseInt(produtoId), quantidade: quantidade, deposito: 'Principal' });
    }
    
    const produto = DB.produtos.find(p => p.id == produtoId);
    if (produto) produto.estoque = quantidade;
    
    DB.save();
    showToast(`✅ Estoque atualizado! Nova quantidade: ${quantidade}`, 'success');
    adicionarNotificacao('📦 Estoque', `Ajuste de estoque: ${motivo}`, 'info');
    openModule('estoque');
}

function realizarTransferencia() {
    const produtoId = document.getElementById('transferProduto')?.value;
    const quantidade = parseInt(document.getElementById('transferQuantidade')?.value);
    const origem = document.getElementById('transferOrigem')?.value || 'Principal';
    const destino = document.getElementById('transferDestino')?.value || 'Secundário';
    
    if (!produtoId || isNaN(quantidade) || quantidade <= 0) {
        showToast('⚠️ Quantidade inválida', 'warning');
        return;
    }
    
    const estoque = DB.estoque.find(e => e.produtoId == produtoId);
    if (!estoque || estoque.quantidade < quantidade) {
        showToast('⚠️ Estoque insuficiente', 'error');
        return;
    }
    
    estoque.quantidade -= quantidade;
    
    // Adicionar ao depósito destino (simplificado)
    const destinoEstoque = DB.estoque.find(e => e.produtoId == produtoId && e.deposito === destino);
    if (destinoEstoque) {
        destinoEstoque.quantidade += quantidade;
    } else {
        DB.estoque.push({ produtoId: parseInt(produtoId), quantidade: quantidade, deposito: destino });
    }
    
    if (!DB.transferencias) DB.transferencias = [];
    DB.transferencias.push({
        id: Date.now().toString(36),
        produto: DB.produtos.find(p => p.id == produtoId)?.nome || 'Produto',
        quantidade: quantidade,
        origem: origem,
        destino: destino,
        data: new Date().toISOString()
    });
    
    DB.save();
    showToast(`✅ Transferência realizada! ${quantidade} unidades movidas`, 'success');
    openModule('estoque-transferencia');
}

let novaCompraItens = [];

function adicionarItemCompra() {
    const produtoId = document.getElementById('novaCompraProduto')?.value;
    const qtd = parseInt(document.getElementById('novaCompraQtd')?.value) || 1;
    const produto = DB.produtos.find(p => p.id == produtoId);
    if (!produto) { showToast('❌ Produto não encontrado', 'error'); return; }
    
    const existente = novaCompraItens.find(i => i.id === produtoId);
    if (existente) {
        existente.quantidade += qtd;
    } else {
        novaCompraItens.push({
            id: produtoId,
            nome: produto.nome,
            preco: produto.preco,
            quantidade: qtd
        });
    }
    atualizarNovaCompra();
    showToast(`✅ ${produto.nome} adicionado!`, 'success');
}

function atualizarNovaCompra() {
    const container = document.getElementById('novaCompraItens');
    const totalEl = document.getElementById('novaCompraTotal');
    if (!container) return;
    
    const total = novaCompraItens.reduce((s, i) => s + (i.preco * i.quantidade), 0);
    
    container.innerHTML = novaCompraItens.map(i => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border);font-size:0.7rem;">
            <span>${i.nome} x${i.quantidade}</span>
            <span style="font-weight:600;">${formatCurrency(i.preco * i.quantidade)}</span>
            <button class="btn btn-danger btn-sm" onclick="removerItemCompra('${i.id}')">✕</button>
        </div>
    `).join('') || '<div style="text-align:center;color:var(--text-muted);font-size:0.7rem;">Nenhum item adicionado</div>';
    
    if (totalEl) totalEl.textContent = formatCurrency(total);
}

function removerItemCompra(id) {
    novaCompraItens = novaCompraItens.filter(i => i.id !== id);
    atualizarNovaCompra();
    showToast('🗑️ Item removido', 'info');
}

function finalizarNovaCompra() {
    if (novaCompraItens.length === 0) { showToast('⚠️ Adicione itens à compra', 'warning'); return; }
    
    const fornecedor = document.getElementById('novaCompraFornecedor')?.value || 'Fornecedor Padrão';
    const total = novaCompraItens.reduce((s, i) => s + (i.preco * i.quantidade), 0);
    
    const compra = {
        id: DB.compras.length + 1,
        fornecedor: fornecedor,
        data: new Date().toISOString(),
        total: total,
        status: 'pendente',
        itens: [...novaCompraItens]
    };
    DB.compras.push(compra);
    
    // Atualizar estoque
    novaCompraItens.forEach(item => {
        const estoque = DB.estoque.find(e => e.produtoId == item.id);
        if (estoque) {
            estoque.quantidade += item.quantidade;
        } else {
            DB.estoque.push({ produtoId: parseInt(item.id), quantidade: item.quantidade, deposito: 'Principal' });
        }
        const produto = DB.produtos.find(p => p.id == item.id);
        if (produto) {
            produto.estoque = (produto.estoque || 0) + item.quantidade;
        }
    });
    
    DB.save();
    novaCompraItens = [];
    atualizarNovaCompra();
    
    showToast(`✅ Compra finalizada! Total: ${formatCurrency(total)}`, 'success');
    openModule('compras');
}

function salvarNovoLead() {
    const nome = document.getElementById('novoLeadNome')?.value?.trim();
    if (!nome) { showToast('⚠️ Nome é obrigatório', 'warning'); return; }
    
    const lead = {
        id: Date.now().toString(36),
        nome: nome,
        telefone: document.getElementById('novoLeadTelefone')?.value || '',
        email: document.getElementById('novoLeadEmail')?.value || '',
        status: document.getElementById('novoLeadStatus')?.value || 'novo',
        origem: document.getElementById('novoLeadOrigem')?.value || 'Outro',
        obs: document.getElementById('novoLeadObs')?.value || '',
        data: new Date().toISOString()
    };
    DB.leads.push(lead);
    DB.save();
    showToast(`✅ Lead "${nome}" cadastrado!`, 'success');
    openModule('crm');
}

function editarLead(id) {
    const lead = DB.leads.find(l => l.id === id);
    if (!lead) { showToast('❌ Lead não encontrado', 'error'); return; }
    const novoStatus = prompt('📊 Novo status (novo, contato, qualificado, proposta, fechado):', lead.status);
    if (novoStatus) {
        lead.status = novoStatus;
        DB.save();
        showToast('✅ Lead atualizado!', 'success');
        openModule('crm');
    }
}

function excluirLead(id) {

    DB.leads = DB.leads.filter(l => l.id !== id);

function renderAnaliseRentabilidade() {
    const vendas = DB.vendas || [];
    const totalVendas = vendas.reduce((s, v) => s + v.total, 0);
    const custos = DB.custosProducao || [];
    const totalCustos = custos.reduce((s, c) => s + (c.material || 0) + (c.maoObra || 0), 0);
    const lucro = totalVendas - totalCustos;
    const margem = totalVendas > 0 ? (lucro / totalVendas) * 100 : 0;
    
    return `
        <div class="card" style="background:linear-gradient(135deg,var(--success),var(--primary-dark));color:#fff;border:none;">
            <h3 style="font-size:0.95rem;font-weight:700;"><i class="fas fa-percent"></i> Análise de Rentabilidade</h3>
            <p style="opacity:0.7;font-size:0.8rem;">Margem de lucro: ${margem.toFixed(1)}%</p>
        </div>
        <div class="metric-grid">
            <div class="metric-card" style="border-left-color:var(--success);"><div class="metric-label">Receita Total</div><div class="metric-value">${formatCurrency(totalVendas)}</div></div>
            <div class="metric-card" style="border-left-color:var(--danger);"><div class="metric-label">Custos Totais</div><div class="metric-value">${formatCurrency(totalCustos)}</div></div>
            <div class="metric-card" style="border-left-color:${lucro >= 0 ? 'var(--success)' : 'var(--danger)'};"><div class="metric-label">Lucro</div><div class="metric-value" style="color:${lucro >= 0 ? 'var(--success)' : 'var(--danger)'};">${formatCurrency(lucro)}</div></div>
            <div class="metric-card" style="border-left-color:var(--info);"><div class="metric-label">Margem</div><div class="metric-value">${margem.toFixed(1)}%</div></div>
        </div>
        <div class="card">
            <div class="card-header"><span class="card-title"><i class="fas fa-list"></i> Detalhamento</span></div>
            <div style="font-size:0.7rem;color:var(--text-muted);">
                <div style="padding:4px 0;border-bottom:1px solid var(--border);">📊 Receita Bruta: ${formatCurrency(totalVendas)}</div>
                <div style="padding:4px 0;border-bottom:1px solid var(--border);">📊 Custos de Produção: ${formatCurrency(totalCustos)}</div>
                <div style="padding:4px 0;border-bottom:1px solid var(--border);">📊 Despesas Operacionais: ${formatCurrency(totalCustos * 0.1)}</div>
                <div style="padding:4px 0;font-weight:700;">💰 Lucro Líquido: ${formatCurrency(lucro - totalCustos * 0.1)}</div>
            </div>
        </div>
    `;
}

function processarFolha() {
    const total = DB.funcionarios.reduce((s, f) => s + (f.salario || 0), 0);
    const folha = {
        id: Date.now().toString(36),
        periodo: new Date().toISOString().slice(0,7),
        funcionarios: DB.funcionarios.length,
        total: total,
        status: 'pendente',
        data: new Date().toISOString()
    };

                            const horas = (saida - entrada) / (1000*60*60);

function renderAtivosDepreciacao() {
    const ativos = DB.ativos || [];
    return `
        <div class="card" style="background:linear-gradient(135deg,var(--info),var(--primary-dark));color:#fff;border:none;">
            <h3 style="font-size:0.95rem;font-weight:700;"><i class="fas fa-chart-line"></i> Depreciação de Ativos</h3>

        </div>
        <div class="card">
            <div class="table-container">

                    <tbody>
                        ${ativos.map(a => {
                            const anos = Math.floor((new Date() - new Date(a.dataAquisicao)) / (1000*60*60*24*365));
                            const depreciacaoTotal = a.valor * (a.depreciacao / 100) * Math.min(anos, 10);

                            return `
                                <tr>
                                    <td><strong>${a.nome}</strong></td>
                                    <td>${formatCurrency(a.valor)}</td>
                                    <td>${a.depreciacao}% ao ano</td>
                                    <td>${formatCurrency(valorAtual)}</td>
                                </tr>
                            `;
                        }).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);">Nenhum ativo cadastrado</td></tr>'}
                    </tbody>
                </table>
            </div>

    `;
}

function buscarRastreio() {

    if (rastreio) {
        showToast(`📦 ${rastreio.produto || 'Encomenda'} - Status: ${rastreio.status || 'pendente'}`, 'info');
    } else {
        // Simular rastreio
        const novoRastreio = {
            id: Date.now().toString(36),
            codigo: codigo,
            produto: 'Produto Rastreado',
            status: 'em_transito',

        </div>
        <div class="chat-container">
            <div class="chat-sidebar">
                <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
                    <span style="font-weight:600;font-size:0.7rem;">Contatos</span>

                </div>
                <div style="margin-top:4px;">
                    <div class="chat-contact active" onclick="carregarChat('Sistema')">
                        <div class="avatar">S</div>
                        <div class="contact-info">
                            <div class="name">Sistema</div>
                            <div class="last-msg">Bem-vindo ao Kanawa Soft!</div>
                        </div>
                    </div>
                    ${contatos.map(c => `
                        <div class="chat-contact" onclick="carregarChat('${c}')">
                            <div class="avatar">${c.charAt(0).toUpperCase()}</div>
                            <div class="contact-info">
                                <div class="name">${c}</div>
                                <div class="last-msg">${mensagens.filter(m => m.remetente === c || m.destinatario === c).pop()?.mensagem || '...'}</div>
                            </div>
                        </div>
                    `).join('')}
                    ${contatos.length === 0 ? '<div style="text-align:center;padding:10px;color:var(--text-muted);font-size:0.6rem;">Nenhum contato</div>' : ''}
                </div>
            </div>
            <div class="chat-main">
                <div class="chat-header">
                    <div class="chat-avatar" id="chatAvatar">S</div>
                    <span class="chat-user" id="chatUser">Sistema</span>
                </div>
                <div class="chat-messages" id="chatMessagesContainer">
                    <div class="chat-msg received">
                        Bem-vindo ao Kanawa Soft! 🚀
                        <span class="msg-time">${new Date().toLocaleString('pt-AO')}</span>
                    </div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter') enviarMensagemChat()">
                    <button class="btn btn-primary" onclick="enviarMensagemChat()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    `;
}

function carregarChat(contact) {
    chatAtual = contact;
    const avatar = document.getElementById('chatAvatar');
    const user = document.getElementById('chatUser');
    const container = document.getElementById('chatMessagesContainer');
    
    if (avatar) avatar.textContent = contact.charAt(0).toUpperCase();
    if (user) user.textContent = contact;
    
    const mensagens = DB.mensagensChat || [];
    const msgs = mensagens.filter(m => m.remetente === contact || m.destinatario === contact || (contact === 'Sistema' && m.remetente === 'Sistema'));
    
    if (container) {
        container.innerHTML = msgs.length > 0 ? msgs.map(m => `
            <div class="chat-msg ${m.remetente === 'Sistema' ? 'received' : 'sent'}">
                ${m.mensagem}
                <span class="msg-time">${formatDateTime(m.data)}</span>
            </div>
        `).join('') : `
            <div class="chat-msg received">
                Nenhuma mensagem com ${contact}
                <span class="msg-time">${new Date().toLocaleString('pt-AO')}</span>
            </div>
        `;
        container.scrollTop = container.scrollHeight;
    }
}

function enviarMensagemChat() {
    const input = document.getElementById('chatInput');
    const mensagem = input?.value?.trim();
    if (!mensagem) return;
    
    const msg = {
        id: Date.now().toString(36),
        remetente: JSON.parse(localStorage.getItem('kanawa_user') || '{"name":"Administrador"}').name || 'Usuário',
        destinatario: chatAtual || 'Sistema',
        mensagem: mensagem,
        data: new Date().toISOString(),
        lida: false
    };
    DB.mensagensChat.push(msg);
    DB.save();
    
    input.value = '';
    carregarChat(chatAtual);
    
    // Simular resposta automática
    if (chatAtual === 'Sistema') {
        setTimeout(() => {
            const respostas = [
                'Obrigado pela sua mensagem! Como posso ajudar?',
                'Ótimo! Estou aqui para ajudar.',
                'Entendido. Vou processar sua solicitação.',
                'Mensagem recebida com sucesso!'
            ];
            const resposta = respostas[Math.floor(Math.random() * respostas.length)];
            const msgResp = {
                id: Date.now().toString(36),
                remetente: 'Sistema',
                destinatario: msg.remetente,
                mensagem: resposta,
                data: new Date().toISOString(),
                lida: false
            };
            DB.mensagensChat.push(msgResp);
            DB.save();
            carregarChat(chatAtual);
        }, 1000 + Math.random() * 2000);
    }
}

function novoContatoChat() {
    const nome = prompt('👤 Nome do contato:');
    if (!nome) return;
    showToast(`✅ Contato "${nome}" adicionado!`, 'success');
    openModule('chat');
}

function filtrarProdutosPDV(termo) {
    const container = document.getElementById('pdvProdutosContainer');
    if (!container) return;
    const items = container.querySelectorAll('div[onclick]');
    const termoLower = termo.toLowerCase().trim();
    items.forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(termoLower) ? '' : 'none';
    });
}

function salvarPerfilCompleto() {
    const nome = document.getElementById('perfilNome')?.value?.trim();
    const email = document.getElementById('perfilEmail')?.value?.trim();
    const telefone = document.getElementById('perfilTelefone')?.value?.trim();
    
    if (nome) {
        const user = JSON.parse(localStorage.getItem('kanawa_user') || '{"name":"Administrador","email":"admin@kanawasoft.com"}');
        user.name = nome;
        if (email) user.email = email;
        localStorage.setItem('kanawa_user', JSON.stringify(user));
        document.getElementById('headerUserName').textContent = nome;
        document.getElementById('headerAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(nome)}&background=1a3a5c&color=fff`;
    }

function importarDadosCompleto() {
    const input = document.getElementById('importFile');
    const file = input?.files?.[0];
    if (!file) {
        showToast('⚠️ Selecione um arquivo', 'warning');
        return;
    }

    const tipo = document.getElementById('importTipo')?.value || 'auto';
    const modo = document.getElementById('importModo')?.value || 'adicionar';
    const resultadoDiv = document.getElementById('importResultado');
    const resultadoConteudo = document.getElementById('importResultadoConteudo');

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            let dados = [];
            const ext = file.name.split('.').pop().toLowerCase();
            
            if (tipo === 'json' || ext === 'json') {
                dados = JSON.parse(e.target.result);
            } else if (tipo === 'csv' || ext === 'csv') {
                dados = parseCSV(e.target.result);
            } else if (tipo === 'excel' || ['xlsx', 'xls'].includes(ext)) {
                try {
                    const workbook = XLSX.read(e.target.result, { type: 'binary' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    dados = XLSX.utils.sheet_to_json(sheet);
                } catch (err) {
                    throw new Error('Erro ao ler arquivo Excel: ' + err.message);
                }
            } else {
                try { dados = JSON.parse(e.target.result); } 
                catch { 
                    try { dados = parseCSV(e.target.result); }
                    catch { throw new Error('Formato não reconhecido'); }
                }
            }

            if (!Array.isArray(dados) && typeof dados === 'object') {
                let totalImportados = 0;
                let colecoes = [];
                
                Object.keys(dados).forEach(key => {
                    if (Array.isArray(dados[key]) && DB.hasOwnProperty(key)) {
                        colecoes.push(key);
                        const dadosColecao = dados[key];
                        if (modo === 'substituir') {
                            DB[key] = dadosColecao;
                        } else if (modo === 'adicionar') {
                            DB[key] = [...DB[key], ...dadosColecao];
                        } else if (modo === 'mesclar') {
                            dadosColecao.forEach(item => {
                                const existente = DB[key].find(dbItem => dbItem.id === item.id);
                                if (existente) {
                                    Object.assign(existente, item);
                                } else {
                                    DB[key].push(item);
                                }
                            });
                        }
                        totalImportados += dadosColecao.length;
                    }
                });
                
                DB.save();
                registrarImportacao(file.name, totalImportados, 'sucesso');
                
                resultadoDiv.style.display = 'block';
                resultadoConteudo.innerHTML = `
                    <div class="alert alert-success">✅ ${totalImportados} registros importados em ${colecoes.length} coleções!</div>
                    <div style="font-size:0.7rem;color:var(--text-muted);">Coleções: ${colecoes.join(', ')}</div>
                `;
                showToast(`✅ ${totalImportados} registros importados!`, 'success');
                atualizarHistoricoImportacao();
                return;
            }

            if (dados.length === 0) {
                throw new Error('Nenhum dado encontrado');
            }

            const colecao = prompt('Para qual coleção importar?\n' + Object.keys(DB).filter(k => Array.isArray(DB[k])).join(', '), 'produtos');
            if (!colecao || !DB.hasOwnProperty(colecao) || !Array.isArray(DB[colecao])) {
                throw new Error('Coleção inválida');
            }

            if (modo === 'substituir') {
                DB[colecao] = dados;
            } else if (modo === 'adicionar') {
                DB[colecao] = [...DB[colecao], ...dados];
            } else if (modo === 'mesclar') {
                dados.forEach(item => {
                    const existente = DB[colecao].find(dbItem => dbItem.id === item.id);
                    if (existente) {
                        Object.assign(existente, item);
                    } else {
                        DB[colecao].push(item);
                    }
                });
            }
            
            DB.save();
            registrarImportacao(file.name, dados.length, 'sucesso');
            
            resultadoDiv.style.display = 'block';
            resultadoConteudo.innerHTML = `
                <div class="alert alert-success">✅ ${dados.length} registros importados para "${colecao}"!</div>
            `;
            showToast(`✅ ${dados.length} registros importados!`, 'success');
            atualizarHistoricoImportacao();
            
        } catch (error) {
            resultadoDiv.style.display = 'block';
            resultadoConteudo.innerHTML = `
                <div class="alert alert-danger">❌ Erro: ${error.message}</div>
            `;
            registrarImportacao(file.name, 0, 'erro');
            showToast(`❌ Erro: ${error.message}`, 'error');
        }
    };
    
    if (['xlsx', 'xls'].includes(file.name.split('.').pop().toLowerCase())) {
        reader.readAsBinaryString(file);
    } else {
        reader.readAsText(file);
    }
}

function exportarDadosAvancado() {
    const formato = document.getElementById('exportFormato')?.value || 'json';
    const escopo = document.getElementById('exportEscopo')?.value || 'todos';
    
    let dados = {};
    let totalRegistros = 0;
    
    if (escopo === 'todos') {
        dados = getDadosCompletos();
        totalRegistros = Object.values(dados).reduce((sum, arr) => sum + (Array.isArray(arr) ? arr.length : 0), 0);
    } else if (escopo === 'selecionados') {
        const selecionados = document.querySelectorAll('.exportColecao:checked');
        selecionados.forEach(el => {
            const key = el.value;
            if (DB.hasOwnProperty(key) && Array.isArray(DB[key])) {
                dados[key] = DB[key];
                totalRegistros += DB[key].length;
            }
        });
        if (Object.keys(dados).length === 0) {
            showToast('⚠️ Selecione pelo menos uma coleção', 'warning');
            return;
        }
    } else if (escopo === 'modulo') {
        const moduleId = currentCategory || 'dashboard';
        dados = getDadosModulo(moduleId);
        totalRegistros = Object.values(dados).reduce((sum, arr) => sum + (Array.isArray(arr) ? arr.length : 0), 0);
    }
    
    if (Object.keys(dados).length === 0) {
        showToast('⚠️ Nenhum dado para exportar', 'warning');
        return;
    }
    
    exportarConteudo(dados, formato, totalRegistros);
}

function getDadosCompletos() {
    const dados = {};
    let total = 0;
    Object.keys(DB).forEach(key => {
        if (Array.isArray(DB[key]) && DB[key].length > 0) {
            dados[key] = DB[key];
            total += DB[key].length;
        }
    });
    dados.metadata = {
        versao: APP_VERSION,
        data: new Date().toISOString(),
        totalRegistros: total,
        app: APP_NAME
    };
    return dados;
}

function getDadosModulo(moduleId) {
    const mapping = {
        'produtos': ['produtos', 'categorias', 'unidades', 'servicos', 'tabelasPrecos', 'avaliacoes'],
        'vendas': ['vendas', 'vendasConsignadas', 'clientes'],
        'estoque': ['estoque', 'inventarios', 'transferencias', 'lotes', 'pecasEstoque'],
        'financeiro': ['contasReceber', 'contasPagar', 'planoContas', 'budgets', 'forecasts', 'conciliacoes'],
        'clientes': ['clientes', 'fidelidade', 'cupons', 'clientesPortal', 'segmentacoes'],
        'rh': ['funcionarios', 'folhasPagamento', 'turnos', 'ferias', 'vagas', 'candidatos', 'desempenhoRH', 'beneficios'],
        'projetos': ['projetos', 'tarefas', 'ganttProjetos', 'timesheets'],
        'ativos': ['ativos', 'manutencoes', 'garantias'],
        'frota': ['frotas', 'gpsTracking', 'abastecimentos', 'multas'],
        'os': ['ordensServico', 'tecnicos', 'ordensManutencao', 'checklistsInspecao', 'calendarioManutencoes']
    };
    
    const colecoes = mapping[moduleId] || [];
    const dados = {};
    colecoes.forEach(key => {
        if (DB.hasOwnProperty(key) && Array.isArray(DB[key])) {
            dados[key] = DB[key];
        }
    });
    return dados;
}

function exportarConteudo(dados, formato, totalRegistros) {
    const nomeArquivo = `kanawa_export_${new Date().toISOString().split('T')[0]}`;
    let blob;
    let extensao;
    
    if (formato === 'json') {
        blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
        extensao = 'json';
    } else if (formato === 'csv') {
        const csv = converterParaCSV(dados);
        blob = new Blob([csv], { type: 'text/csv' });
        extensao = 'csv';
    } else if (formato === 'excel') {
        try {
            const wb = XLSX.utils.book_new();
            Object.keys(dados).forEach(key => {
                if (Array.isArray(dados[key]) && dados[key].length > 0) {
                    const ws = XLSX.utils.json_to_sheet(dados[key]);
                    XLSX.utils.book_append_sheet(wb, ws, key.slice(0, 31));
                }
            });
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            blob = new Blob([wbout], { type: 'application/octet-stream' });
            extensao = 'xlsx';
        } catch (err) {
            showToast(`❌ Erro ao exportar Excel: ${err.message}`, 'error');
            return;
        }
    }
    
    if (!blob) return;
    
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${nomeArquivo}.${extensao}`;
    link.click();
    URL.revokeObjectURL(link.href);
    
    const historico = JSON.parse(localStorage.getItem('kanawa_export_historico') || '[]');
    const id = Date.now().toString(36);
    historico.push({
        id: id,
        data: new Date().toISOString(),
        formato: formato,
        registros: totalRegistros || Object.values(dados).reduce((sum, arr) => sum + (Array.isArray(arr) ? arr.length : 0), 0),
        nome: link.download
    });
    localStorage.setItem('kanawa_export_historico', JSON.stringify(historico));
    
    showToast(`📤 ${totalRegistros || 'Dados'} exportados em ${formato.toUpperCase()}!`, 'success');
    atualizarHistoricoExportacao();
}

function converterParaCSV(dados) {
    let csv = '';
    let first = true;
    Object.keys(dados).forEach(key => {
        if (Array.isArray(dados[key]) && dados[key].length > 0) {
            if (!first) csv += '\n\n';
            csv += `# ${key}\n`;
            const headers = Object.keys(dados[key][0]);
            csv += headers.join(',') + '\n';
            dados[key].forEach(row => {
                csv += headers.map(h => {
                    let val = row[h] || '';
                    if (typeof val === 'string' && (val.includes(',') || val.includes('"'))) {
                        val = `"${val.replace(/"/g, '""')}"`;
                    }
                    return val;
                }).join(',') + '\n';
            });
            first = false;
        }
    });
    return csv;
}

function parseCSV(text) {
    const lines = text.split('\n').filter(line => line.trim());
    if (lines.length === 0) return [];
    
    const headers = lines[0].split(',').map(h => h.trim());
    const result = [];
    
    for (let i = 1; i < lines.length; i++) {
        const values = lines[i].split(',').map(v => v.trim());
        const obj = {};
        headers.forEach((h, idx) => {
            obj[h] = values[idx] || '';
        });
        result.push(obj);
    }
    return result;
}

function renderDevDB() {
    const stats = Object.keys(DB)
        .filter(k => Array.isArray(DB[k]))
        .map(k => ({
            nome: k,
            total: DB[k].length,
            primeiro: DB[k][0] ? Object.keys(DB[k][0]).slice(0, 3).join(', ') + '...' : '-'
        }))
        .sort((a, b) => b.total - a.total);
    
    const totalRegistros = stats.reduce((sum, s) => sum + s.total, 0);
    const tamanhoTotal = new Blob([JSON.stringify(DB)]).size;
    const tamanhoKB = (tamanhoTotal / 1024).toFixed(1);
    
    return `
        <div class="card" style="background:linear-gradient(135deg,var(--info),var(--primary-dark));color:#fff;border:none;">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">

                    <p style="opacity:0.7;font-size:0.8rem;">${stats.length} coleções | ${totalRegistros} registros | ${tamanhoKB} KB</p>
                </div>
                <div style="display:flex;gap:4px;">
                    <button class="btn btn-sm btn-success" onclick="compactarDB()"><i class="fas fa-compress"></i> Compactar</button>
                    <button class="btn btn-sm btn-info" onclick="backupDB()"><i class="fas fa-database"></i> Backup</button>

            </div>
        </div>
        <div class="metric-grid">
            <div class="metric-card"><div class="metric-label">Coleções</div><div class="metric-value">${stats.length}</div></div>
            <div class="metric-card" style="border-left-color:var(--success);"><div class="metric-label">Registros</div><div class="metric-value">${totalRegistros}</div></div>
            <div class="metric-card" style="border-left-color:var(--warning);"><div class="metric-label">Tamanho</div><div class="metric-value">${tamanhoKB} KB</div></div>
            <div class="metric-card" style="border-left-color:var(--info);"><div class="metric-label">Último Backup</div><div class="metric-value">${DB.backups.length > 0 ? formatDate(DB.backups[DB.backups.length-1]?.data) : 'Nunca'}</div></div>
        </div>
        <div class="card">
            <div class="card-header">
                <span class="card-title"><i class="fas fa-list"></i> Coleções</span>
                <div style="display:flex;gap:4px;">
                    <button class="btn btn-sm btn-primary" onclick="ordenarColecoes('nome')"><i class="fas fa-sort-alpha-down"></i> Nome</button>
                    <button class="btn btn-sm btn-secondary" onclick="ordenarColecoes('total')"><i class="fas fa-sort-numeric-down"></i> Registros</button>
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead><tr>
                        <th>Coleção</th>
                        <th style="text-align:center;">Registros</th>
                        <th>Campos</th>
                        <th style="text-align:center;">Ações</th>
                    </tr></thead>
                    <tbody id="dbTableBody">
                        ${stats.map(s => `
                            <tr>
                                <td><code style="font-size:0.7rem;">${s.nome}</code></td>
                                <td style="text-align:center;"><span class="badge ${s.total > 0 ? 'badge-success' : 'badge-secondary'}">${s.total}</span></td>
                                <td style="font-size:0.65rem;color:var(--text-muted);">${s.primeiro}</td>
                                <td style="text-align:center;">
                                    <button class="btn btn-sm btn-info" onclick="visualizarColecao('${s.nome}')"><i class="fas fa-eye"></i></button>
                                    <button class="btn btn-sm btn-primary" onclick="exportarColecao('${s.nome}')"><i class="fas fa-file-export"></i></button>

                </table>
            </div>
        </div>

            <div class="card-header"><span class="card-title"><i class="fas fa-tools"></i> Ferramentas</span></div>
            <div class="form-actions" style="flex-wrap:wrap;">
                <button class="btn btn-success" onclick="reindexarDB()"><i class="fas fa-sync"></i> Reindexar</button>
                <button class="btn btn-warning" onclick="validarDB()"><i class="fas fa-check-double"></i> Validar</button>
                <button class="btn btn-info" onclick="estatisticasDB()"><i class="fas fa-chart-pie"></i> Estatísticas</button>

function excluirVenda(id) {
    if (!confirm('Tem certeza que deseja excluir esta venda?')) return;
    DB.vendas = DB.vendas.filter(v => v.id !== id);
    DB.save();
    showToast('🗑️ Venda excluída!', 'success');
    openModule('vendas');
}

    const receber = DB.contasReceber || [];
    const pagar = DB.contasPagar || [];
    const totalReceber = receber.reduce((s, c) => s + c.valor, 0);
    const totalPagar = pagar.reduce((s, c) => s + c.valor, 0);
    
    return `
        <div class="card" style="background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;">
            <h3 style="font-size:0.95rem;font-weight:700;"><i class="fas fa-coins"></i> Financeiro</h3>
            <p style="opacity:0.7;font-size:0.8rem;">Resumo financeiro</p>
        </div>
        <div class="metric-grid">
            <div class="metric-card" style="border-left-color:var(--success);"><div class="metric-label">A Receber</div><div class="metric-value" style="color:var(--success);">${formatCurrency(totalReceber)}</div></div>
            <div class="metric-card" style="border-left-color:var(--danger);"><div class="metric-label">A Pagar</div><div class="metric-value" style="color:var(--danger);">${formatCurrency(totalPagar)}</div></div>
            <div class="metric-card" style="border-left-color:${(totalReceber - totalPagar) >= 0 ? 'var(--success)' : 'var(--danger)'};"><div class="metric-label">Saldo Líquido</div><div class="metric-value" style="color:${(totalReceber - totalPagar) >= 0 ? 'var(--success)' : 'var(--danger)'};">${formatCurrency(totalReceber - totalPagar)}</div></div>
            <div class="metric-card" style="border-left-color:var(--info);"><div class="metric-label">Transações</div><div class="metric-value">${receber.length + pagar.length}</div></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="card">
                <div class="card-header"><span class="card-title"><i class="fas fa-hand-holding-heart"></i> A Receber</span></div>
                <div style="max-height:200px;overflow-y:auto;font-size:0.7rem;">
                    ${receber.slice(0,5).map(c => `
                        <div style="padding:4px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;">
                            <span>${c.cliente}</span>
                            <span style="font-weight:600;">${formatCurrency(c.valor)}</span>
                        </div>
                    `).join('') || 'Nenhuma conta a receber'}
                </div>
            </div>
            <div class="card">
                <div class="card-header"><span class="card-title"><i class="fas fa-hand-holding-usd"></i> A Pagar</span></div>
                <div style="max-height:200px;overflow-y:auto;font-size:0.7rem;">
                    ${pagar.slice(0,5).map(c => `
                        <div style="padding:4px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;">
                            <span>${c.fornecedor}</span>
                            <span style="font-weight:600;">${formatCurrency(c.valor)}</span>
                        </div>
                    `).join('') || 'Nenhuma conta a pagar'}
                </div>
            </div>
        </div>
    `;
}

                <div class="form-group" style="grid-column:1/-1;">

            </div>

        <div id="tendenciaResultado" style="display:none;" class="card">

        </div>
    `;

// ============================================================
// 200. FUNÇÃO DE RENDERIZAÇÃO - RELATÓRIOS EXECUTIVOS (COMPLETA)
// ============================================================

function renderRelatoriosExecutivos() {
    const vendas = DB.vendas || [];
    const totalVendas = vendas.reduce((s, v) => s + v.total, 0);
    
    return `
        <div class="card" style="background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;">
            <h3 style="font-size:0.95rem;font-weight:700;"><i class="fas fa-file-alt"></i> Relatórios Executivos</h3>
            <p style="opacity:0.7;font-size:0.8rem;">Visão estratégica do negócio</p>
        </div>
        <div class="metric-grid">
            <div class="metric-card"><div class="metric-label">Faturamento</div><div class="metric-value">${formatCurrency(totalVendas)}</div></div>
            <div class="metric-card" style="border-left-color:var(--success);"><div class="metric-label">Vendas</div><div class="metric-value">${vendas.length}</div></div>
            <div class="metric-card" style="border-left-color:var(--warning);"><div class="metric-label">Clientes</div><div class="metric-value">${DB.clientes.length}</div></div>
            <div class="metric-card" style="border-left-color:var(--info);"><div class="metric-label">Produtos</div><div class="metric-value">${DB.produtos.length}</div></div>
        </div>
        <div class="card">
            <div class="card-header"><span class="card-title"><i class="fas fa-list"></i> Indicadores-Chave</span></div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;">
                <div style="background:var(--bg);padding:12px;border-radius:var(--radius-sm);border-left:3px solid var(--primary);">
                    <div style="font-size:0.6rem;color:var(--text-muted);">Ticket Médio</div>
                    <div style="font-weight:700;font-size:1rem;">${vendas.length > 0 ? formatCurrency(totalVendas / vendas.length) : 'AOA 0,00'}</div>
                </div>
                <div style="background:var(--bg);padding:12px;border-radius:var(--radius-sm);border-left:3px solid var(--success);">
                    <div style="font-size:0.6rem;color:var(--text-muted);">Clientes Ativos</div>
                    <div style="font-weight:700;font-size:1rem;">${DB.clientes.filter(c => c.ativo !== false).length}</div>
                </div>
                <div style="background:var(--bg);padding:12px;border-radius:var(--radius-sm);border-left:3px solid var(--warning);">
                    <div style="font-size:0.6rem;color:var(--text-muted);">Produtos em Estoque</div>
                    <div style="font-weight:700;font-size:1rem;">${DB.estoque.reduce((s, e) => s + (e.quantidade || 0), 0)}</div>
                </div>
                <div style="background:var(--bg);padding:12px;border-radius:var(--radius-sm);border-left:3px solid var(--info);">
                    <div style="font-size:0.6rem;color:var(--text-muted);">ROI Estimado</div>
                    <div style="font-weight:700;font-size:1rem;">${totalVendas > 0 ? '+18%' : '0%'}</div>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="form-actions">
                <button class="btn btn-success" onclick="gerarRelatorioExecutivo()"><i class="fas fa-file-pdf"></i> Gerar PDF</button>
                <button class="btn btn-info" onclick="exportarRelatorioExecutivo()"><i class="fas fa-file-excel"></i> Exportar Excel</button>
            </div>
        </div>
    `;
}

// ============================================================
// 201. FUNÇÃO DE RENDERIZAÇÃO - RELATÓRIOS FINANCEIROS (COMPLETA)
// ============================================================

function renderRelatoriosFinanceiros() {
    const receber = DB.contasReceber || [];
    const pagar = DB.contasPagar || [];
    const totalReceber = receber.reduce((s, c) => s + c.valor, 0);
    const totalPagar = pagar.reduce((s, c) => s + c.valor, 0);
    
    return `
        <div class="card" style="background:linear-gradient(135deg,var(--success),var(--primary-dark));color:#fff;border:none;">
            <h3 style="font-size:0.95rem;font-weight:700;"><i class="fas fa-coins"></i> Relatórios Financeiros</h3>
            <p style="opacity:0.7;font-size:0.8rem;">Análise financeira detalhada</p>
        </div>
        <div class="metric-grid">
            <div class="metric-card"><div class="metric-label">A Receber</div><div class="metric-value" style="color:var(--success);">${formatCurrency(totalReceber)}</div></div>
            <div class="metric-card" style="border-left-color:var(--danger);"><div class="metric-label">A Pagar</div><div class="metric-value" style="color:var(--danger);">${formatCurrency(totalPagar)}</div></div>
            <div class="metric-card" style="border-left-color:var(--info);"><div class="metric-label">Saldo Líquido</div><div class="metric-value" style="color:${(totalReceber - totalPagar) >= 0 ? 'var(--success)' : 'var(--danger)'};">${formatCurrency(totalReceber - totalPagar)}</div></div>
            <div class="metric-card" style="border-left-color:var(--warning);"><div class="metric-label">Índice de Liquidez</div><div class="metric-value">${totalPagar > 0 ? (totalReceber / totalPagar).toFixed(2) : '∞'}</div></div>
        </div>
        <div class="card">
            <div class="card-header"><span class="card-title"><i class="fas fa-list"></i> Resumo por Categoria</span></div>
            <div class="table-container">
                <table>
                    <thead><tr><th>Categoria</th><th>Valor</th><th>%</th></tr></thead>
                    <tbody>
                        <tr><td>Vendas</td><td>${formatCurrency(totalReceber)}</td><td>${(totalReceber / (totalReceber + totalPagar) * 100).toFixed(1)}%</td></tr>
                        <tr><td>Compras</td><td>${formatCurrency(totalPagar)}</td><td>${(totalPagar / (totalReceber + totalPagar) * 100).toFixed(1)}%</td></tr>
                        ${totalReceber + totalPagar > 0 ? `
                            <tr style="font-weight:bold;border-top:2px solid var(--border);">
                                <td>Total</td>
                                <td>${formatCurrency(totalReceber + totalPagar)}</td>
                                <td>100%</td>
                            </tr>
                        ` : ''}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}
</script>
